name: Pruebas

# Corre las pruebas automáticas (npm test) en cada push y en cada Pull Request.
# No publica nada: solo avisa si algo se rompió.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node --test expande el glob de package.json recién desde Node 21.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
