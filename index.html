      const handleCopy = () => {
        if (!selected) return;
        const opt = activeOptions[selected];
        const text = c.reportText(opt.label, opt.desc);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      return (
        <div className="space-y-4 animate-in fade-in">
          <Card>
            <h3 className="font-semibold text-slate-800 dark:text-slate-200 mb-2 text-sm">{c.treatmentTypeLabel}</h3>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
              <button
                onClick={() => handleTypeChange('locoregional')}
                className={`p-3 rounded-xl border text-sm text-left transition-all ${treatmentType === 'locoregional' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}
              >
                {c.treatmentLocoregional}
              </button>
              <button
                onClick={() => handleTypeChange('sbrt')}
                className={`p-3 rounded-xl border text-sm text-left transition-all ${treatmentType === 'sbrt' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}
              >
                {c.treatmentSbrt}
              </button>
            </div>
          </Card>
          <Card>
            <h3 className="font-semibold text-slate-800 dark:text-slate-200 mb-1 text-sm">{c.selectLabel}</h3>
            <div className="space-y-2">
              {Object.entries(activeOptions).map(([key, opt]) => (
                <button
                  key={key}
                  onClick={() => setSelected(key)}
                  className={`w-full text-left p-3 rounded-xl border text-sm transition-all ${selected === key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}
                >
                  <span className="font-semibold block mb-0.5">LR-TR {opt.label}</span>
                  <span className="text-xs opacity-80">{opt.desc}</span>
                </button>
              ))}
            </div>
          </Card>
          {selected && (
            <Card className="text-center">
              <span className="text-3xl font-black text-blue-600 dark:text-blue-400">LR-TR {activeOptions[selected].label}</span>
              <CopyButton onClick={handleCopy}>{t.common.copyReport}</CopyButton>
            </Card>
          )}
          {isSbrt && <InfoBox tone="amber">{c.sbrtCaveat}</InfoBox>}
          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.liradsTr} />
          <ReportBugLink calcTitle={c.title} />
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: CAD-RADS 2.0 (ANGIO-TC CORONARIA)
    ============================================================ */
    function CADRADS() {
      const { t, lang } = useLang();
      const c = t.calc.cadrads;
      const [stenosis, setStenosis] = useState(null);
      const [mods, setMods] = useState({ N: false, S: false, G: false, I: false, HRP: false, E: false });
      const [pMod, setPMod] = useState('');

      const toggleMod = (key) => setMods(prev => ({ ...prev, [key]: !prev[key] }));
      const modString = [...Object.entries(mods).filter(([,v]) => v).map(([k]) => k), ...(pMod ? [pMod] : [])].join('/');
      const resultString = stenosis ? `CAD-RADS ${stenosis}${modString ? '/' + modString : ''}` : '';

      const handleCopy = () => {
        if (!stenosis) return;
        const text = c.reportText(stenosis, modString);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      const riskColor = !stenosis ? '' : ['0','1'].includes(stenosis) ? 'text-emerald-500' : ['2','3'].includes(stenosis) ? 'text-amber-500' : stenosis === 'N' ? 'text-slate-400' : 'text-red-500';

      return (
        <div className="space-y-4 animate-in fade-in">
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.stenosisLabel}</label>
            <div className="space-y-2">
              {c.stenosisOptions.map(opt => (
                <button
                  key={opt.key}
                  onClick={() => setStenosis(opt.key)}
                  className={`w-full text-left p-3 rounded-xl border text-sm transition-all flex justify-between items-center ${stenosis === opt.key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}
                >
                  <span>{opt.label}</span>
                  <span className="text-xs font-bold shrink-0 ml-2">{opt.key}</span>
                </button>
              ))}
            </div>
          </Card>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.modifiersLabel}</label>
            <div className="grid grid-cols-2 gap-2">
              {[['N', c.modN],['S', c.modS],['G', c.modG],['I', c.modI],['HRP', c.modHrp],['E', c.modE]].map(([key, label]) => (
                <button key={key} onClick={() => toggleMod(key)} className={`text-left p-2.5 rounded-lg border text-xs transition-all flex items-center gap-1.5 ${mods[key] ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>
                  {mods[key] ? <IconCheckCircle size={14} /> : <span className="w-3.5" />} {label}
                </button>
              ))}
            </div>
            {mods.HRP && <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-2 leading-snug">{c.modHrpHint}</p>}
          </Card>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.pModifierLabel}</label>
            <div className="space-y-2">
              <button onClick={() => setPMod('')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${pMod === '' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.pNone}</button>
              {c.pOptions.map(opt => (
                <button key={opt.key} onClick={() => setPMod(opt.key)} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${pMod === opt.key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{opt.label}</button>
              ))}
            </div>
            {pMod && <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-2 leading-snug">{c.pCaveat}</p>}
          </Card>
          {stenosis && (
            <Card className="text-center">
              <span className="text-xs text-slate-500 block mb-1">{c.resultLabel}</span>
              <span className={`text-3xl font-black ${riskColor}`}>{resultString}</span>
              <CopyButton onClick={handleCopy}>{t.common.copyReport}</CopyButton>
            </Card>
          )}
          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.cadrads} />
          <ReportBugLink calcTitle={c.title} />
        </div>
      );
    }

    /* ============================================================
       LISTADO DE CALCULADORAS
    ============================================================ */
    const calculators = [
      { id: 'psad', catKey: 'abdomen', component: PSADCalculator },
      { id: 'mriFf', catKey: 'abdomen', component: MRIFatFraction },
      { id: 'adrenalCt', catKey: 'abdomen', component: AdrenalWashout },
      { id: 'adrenalMri', catKey: 'abdomen', component: AdrenalCSI },
      { id: 'siderosis', catKey: 'abdomen', component: HepaticSiderosis },
      { id: 'thymic', catKey: 'torax', component: ThymicFat },
      { id: 'tirads', catKey: 'strat', component: TIRADS },
      { id: 'orads', catKey: 'strat', component: ORADS },
      { id: 'pirads', catKey: 'strat', component: PIRADS },
      { id: 'virads', catKey: 'strat', component: VIRADS },
      { id: 'lirads', catKey: 'strat', component: LIRADS },
      { id: 'liradsTr', catKey: 'strat', component: LIRADSTreatmentResponse },
      { id: 'cadrads', catKey: 'cardio', component: CADRADS },
    ];

    /* ============================================================
       PIE DE PÁGINA (crédito + contacto + disclaimer)
    ============================================================ */
    function SiteFooter() {
      const { t, lang } = useLang();
      return (
        <footer className="mt-10 pt-6 border-t border-slate-200 dark:border-slate-800 space-y-4 text-center">
          <p className="text-xs text-slate-400 dark:text-slate-500 leading-relaxed max-w-sm mx-auto">
            {t.common.disclaimer}
          </p>
          <div className="flex items-center justify-center gap-4 flex-wrap">
            <a
              href={LINKEDIN_URL}
              target="_blank"
              rel="noopener noreferrer"
              className="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
            >
              <IconLinkedin size={16} />
              {t.common.createdBy} Dr. Joaquín Hevia M.
            </a>
            <a
              href={buildMailto(null, lang, 'bug')}
              className="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
            >
              <IconMail size={16} />
              {t.common.reportBugGeneral}
            </a>
            <a
              href={buildMailto(null, lang, 'update')}
              className="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
            >
              <IconMail size={16} />
              {t.common.suggestUpdate}
            </a>
            <a
              href={buildMailto(null, lang, 'suggestion')}
              className="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
            >
              <IconMail size={16} />
              {t.common.suggestGeneral}
            </a>
            <button
              onClick={() => copyToClipboard(REPORT_EMAIL, t.common.emailCopiedOk, t.common.copiedErr)}
              className="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
            >
              <IconCopy size={16} />
              {t.common.copyEmail}
            </button>
          </div>
          <p className="text-[11px] text-slate-300 dark:text-slate-600">{REPORT_EMAIL} · RadioCalc Clinical</p>
        </footer>
      );
    }

    /* ============================================================
       APP PRINCIPAL
    ============================================================ */
    function App() {
      const [darkMode, setDarkMode] = useState(true);
      const [lang, setLang] = useState('es');
      const [activeCalc, setActiveCalc] = useState(null);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', darkMode);
      }, [darkMode]);

      useEffect(() => {
        document.documentElement.lang = lang;
      }, [lang]);

      const t = STRINGS[lang];
      const toggleLang = () => setLang(l => (l === 'es' ? 'en' : 'es'));

      const activeEntry = activeCalc ? calculators.find(cc => cc.id === activeCalc) : null;
      const activeTitle = activeEntry ? t.calc[activeEntry.id].title : null;

      const categoryOrder = ['abdomen', 'torax', 'cardio', 'strat', 'gyn', 'gu', 'oncrecto'];

      return (
        <LangContext.Provider value={{ lang, t, toggleLang }}>
          <div className="min-h-screen bg-slate-50 dark:bg-slate-900 pb-10">
            <header className="sticky top-0 z-50 bg-blue-600 dark:bg-slate-800 text-white shadow-md px-4 py-3 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 min-w-0">
                {activeCalc ? (
                  <button onClick={() => setActiveCalc(null)} aria-label={t.common.back} className="p-1 -ml-1 hover:bg-white/20 rounded-full transition-colors shrink-0">
                    <IconChevronLeft className="w-6 h-6" />
                  </button>
                ) : (
                  <Logo size={32} />
                )}
                <h1 className="text-base sm:text-lg font-bold tracking-tight truncate">
                  {activeTitle || t.appName}
                </h1>
              </div>
              <div className="flex items-center gap-1 shrink-0">
                <button
                  onClick={toggleLang}
                  aria-label="Toggle language"
                  className="px-2.5 py-1.5 text-xs font-bold rounded-full hover:bg-white/20 transition-colors border border-white/30"
                >
                  {lang === 'es' ? 'EN' : 'ES'}
                </button>
                <button onClick={() => setDarkMode(!darkMode)} aria-label="Toggle theme" className="p-2 hover:bg-white/20 rounded-full transition-colors">
                  {darkMode ? <IconSun /> : <IconMoon />}
                </button>
              </div>
            </header>
            <main className="max-w-md mx-auto p-4">
              {activeEntry ? (
                <div>{React.createElement(activeEntry.component)}</div>
              ) : (
                <div className="space-y-6">
                  <div className="flex flex-col items-center text-center gap-3 py-4">
                    <Logo size={56} />
                    <div>
                      <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100">{t.appName}</h2>
                      <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-xs">{t.tagline}</p>
                    </div>
                  </div>
                  {categoryOrder.filter(catKey => calculators.some(cc => cc.catKey === catKey)).map(catKey => (
                    <div key={catKey}>
                      <h2 className="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3 px-1">
                        {t.categories[catKey]}
                      </h2>
                      <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden divide-y divide-slate-100 dark:divide-slate-700">
                        {calculators.filter(cc => cc.catKey === catKey).map(cc => (
                          <button
                            key={cc.id}
                            onClick={() => setActiveCalc(cc.id)}
                            className="w-full text-left px-5 py-4 active:bg-slate-50 dark:active:bg-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors flex justify-between items-center gap-3"
                          >
                            <span className="font-medium text-slate-700 dark:text-slate-200">{t.calc[cc.id].title}</span>
                            <IconChevronLeft className="text-slate-400 transform rotate-180 w-4 h-4 shrink-0" />
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                  <SiteFooter />
                </div>
              )}
            </main>
          </div>
        </LangContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
