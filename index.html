</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-50 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useContext, createContext } = React;

    /* ============================================================
       IDIOMA / LANGUAGE
    ============================================================ */
    const LangContext = createContext({ lang: 'es', t: null, toggleLang: () => {} });
    const useLang = () => useContext(LangContext);

    /* ============================================================
       UTILIDADES
    ============================================================ */
    const copyToClipboard = async (text, msgOk, msgErr) => {
      try {
        await navigator.clipboard.writeText(text);
        alert(msgOk);
      } catch (err) {
        alert(msgErr);
      }
    };

    const REPORT_EMAIL = 'drjoaquinhevia@gmail.com';
    const LINKEDIN_URL = 'https://www.linkedin.com/in/joaqu%C3%ADn-hevia-morel-07421675/';

    const buildMailto = (calcTitle, lang) => {
      const subject = lang === 'es'
        ? `RadioCalc Clinical - Reporte de error${calcTitle ? ' (' + calcTitle + ')' : ''}`
        : `RadioCalc Clinical - Bug report${calcTitle ? ' (' + calcTitle + ')' : ''}`;
      const body = lang === 'es'
        ? `Hola Dr. Hevia,\n\nEncontré un posible error en la calculadora: ${calcTitle || '(general del sitio)'}.\n\nDescripción del problema:\n- \n\nValores ingresados (si aplica):\n- \n\nResultado esperado vs. obtenido:\n- \n\nGracias.`
        : `Hi Dr. Hevia,\n\nI found a possible error in the calculator: ${calcTitle || '(general site issue)'}.\n\nDescription of the issue:\n- \n\nInput values (if applicable):\n- \n\nExpected vs. obtained result:\n- \n\nThanks.`;
      return `mailto:${REPORT_EMAIL}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    };

       ICONOS (inline SVG, estilo lucide)
    ============================================================ */

    const IconAlertTriangle = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;
    const IconCheckCircle = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
    const IconChevronLeft = ({className}) => <svg className={className || ""} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>;

    const IconSun = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>;
    const IconArrowRight = ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;

    const IconAlertCircle = IconInfo;
    const IconMail = ({size=18}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>;
    const IconLinkedin = ({size=18}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>;
    const IconBookOpen = ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
    const IconStethoscope = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"></path><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"></path><circle cx="20" cy="10" r="2"></circle></svg>;

    /* ============================================================
       LOGO
    ============================================================ */
    function Logo({ size = 40 }) {
      const id = React.useId ? React.useId() : 'logo';
      return (
        <svg width={size} height={size} viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" className="shrink-0">
          <defs>
            <linearGradient id={`grad-${id}`} x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stopColor="#2563eb" />
              <stop offset="1" stopColor="#06b6d4" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="16" fill={`url(#grad-${id})`} />
          <circle cx="32" cy="32" r="9" fill="none" stroke="white" strokeWidth="3" />
          <circle cx="32" cy="32" r="18" fill="none" stroke="white" strokeOpacity="0.55" strokeWidth="3" />
          <circle cx="32" cy="32" r="3.4" fill="white" />
        </svg>
      );
    }

    /* ============================================================
       COMPONENTES REUTILIZABLES
    ============================================================ */
    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-4 ${className}`}>
          {children}
        </div>
      );
    }

    function NumberField({ label, value, onChange, placeholder, small }) {
      return (
        <div>
          {label && <label className="block text-xs text-slate-500 dark:text-slate-400 mb-1">{label}</label>}
          <input
            type="number"
            inputMode="decimal"
            placeholder={placeholder}
            value={value}
            onChange={e => onChange(e.target.value)}
            className={`w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg ${small ? 'p-2.5 text-center' : 'p-3 text-lg'} focus:ring-2 focus:ring-blue-500 outline-none`}
          />
        </div>
      );
    }

    function CopyButton({ onClick, children }) {
      return (
        <button onClick={onClick} className="w-full flex items-center justify-center gap-2 bg-blue-50 dark:bg-blue-500/10 text-blue-600 dark:text-blue-400 py-3 rounded-xl font-medium hover:bg-blue-100 dark:hover:bg-blue-500/20 active:scale-95 transition-all">
          <IconCopy size={18} /> {children}
        </button>
      );
    }

    function InfoBox({ tone = 'amber', children }) {
      const tones = {
        amber: 'bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-400',
        emerald: 'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-400',
      };
      return (
        <div className={`p-3 rounded-lg flex items-start gap-3 text-sm ${tones[tone]}`}>
          <IconAlertCircle size={20} className="shrink-0 mt-0.5" />
          <p>{children}</p>
        </div>
      );
    }

    // Sección de referencias bibliográficas, colapsable, al pie de cada calculadora
    function References({ items }) {
      const { t } = useLang();
      const [open, setOpen] = useState(false);
      if (!items || items.length === 0) return null;
      return (
        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden">
          <button
            onClick={() => setOpen(!open)}
            className="w-full flex items-center justify-between px-5 py-3.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/40 transition-colors"
          >
            <span className="flex items-center gap-2"><IconBookOpen size={16} /> {t.common.references}</span>
            <IconChevronDown className={`transition-transform ${open ? 'rotate-180' : ''}`} />
          </button>
          {open && (
            <ol className="refs-enter px-5 pb-4 space-y-2 text-xs text-slate-500 dark:text-slate-400 list-decimal list-inside border-t border-slate-100 dark:border-slate-700 pt-3">
              {items.map((ref, i) => <li key={i} className="leading-relaxed">{ref}</li>)}
            </ol>
          )}
        </div>
      );
    }

    // Botón para reportar un error, disponible dentro de cada calculadora
    function ReportBugLink({ calcTitle }) {
      const { t, lang } = useLang();
      return (
        <a
          href={buildMailto(calcTitle, lang)}
          className="flex items-center justify-center gap-2 text-xs text-slate-400 hover:text-blue-500 dark:hover:text-blue-400 transition-colors py-2"
        >
          <IconMail size={14} /> {t.common.reportBug}
        </a>
      );
    }

    /* ============================================================
       TEXTOS / STRINGS (ES / EN)
    ============================================================ */
    const STRINGS = {

    /* ============================================================
       CALCULADORA: PSAD Y VOLUMEN PROSTÁTICO
    ============================================================ */
    function PSADCalculator() {
      const { t, lang } = useLang();
      const c = t.calc.psad;
      const [ap, setAp] = useState('');
      const [tr, setTr] = useState('');
      const [long, setLong] = useState('');
      const [psa, setPsa] = useState('');
      const [factor, setFactor] = useState(0.52);
      const vol = (parseFloat(ap) || 0) * (parseFloat(tr) || 0) * (parseFloat(long) || 0) * factor;
      const psad = (parseFloat(psa) || 0) / (vol || 1);
      const showResults = ap && tr && long && psa;
      const isHighRisk = psad >= 0.15;

      const handleCopy = () => {
        const text = c.reportText(vol.toFixed(1), psa, psad.toFixed(2), isHighRisk ? c.highRisk : c.normal);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      return (
        <div className="space-y-4 animate-in fade-in">
          <Card>
            <div>
              <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">{c.dims}</label>
              <div className="grid grid-cols-3 gap-2">
                <NumberField small placeholder={c.ap} value={ap} onChange={setAp} />
                <NumberField small placeholder={c.tr} value={tr} onChange={setTr} />
                <NumberField small placeholder={c.long} value={long} onChange={setLong} />
              </div>
            </div>
            <NumberField label={c.psaLabel} placeholder={c.psaPh} value={psa} onChange={setPsa} />
            <div className="flex items-center justify-between mt-2 text-sm text-slate-500">
              <span>{c.formulaFactor}:</span>
              <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-lg">
                <button onClick={() => setFactor(0.52)} className={`px-3 py-1 rounded-md ${factor === 0.52 ? 'bg-white dark:bg-slate-700 shadow-sm font-medium text-slate-900 dark:text-white' : ''}`}>0.52</button>
                <button onClick={() => setFactor(0.523)} className={`px-3 py-1 rounded-md ${factor === 0.523 ? 'bg-white dark:bg-slate-700 shadow-sm font-medium text-slate-900 dark:text-white' : ''}`}>0.523</button>
              </div>
            </div>
          </Card>
          {showResults && (
            <Card>
              <div className="flex justify-between items-center pb-3 border-b border-slate-100 dark:border-slate-700">
                <span className="text-slate-500 dark:text-slate-400">{c.volume}</span>
                <span className="text-xl font-bold">{vol.toFixed(1)} cc</span>
              </div>
              <div className="flex justify-between items-center">
                <span className="text-slate-500 dark:text-slate-400">{c.psad}</span>
                <span className={`text-2xl font-bold flex items-center gap-2 ${isHighRisk ? 'text-red-500' : 'text-emerald-500'}`}>
                  {isHighRisk ? <IconAlertTriangle size={20} /> : <IconCheckCircle size={20} />}
                  {psad.toFixed(2)}
                </span>
              </div>
              <CopyButton onClick={handleCopy}>{t.common.copyReport}</CopyButton>
            </Card>
          )}
          <References items={REFERENCES.psad} />
          <ReportBugLink calcTitle={c.title} />
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: FRACCIÓN GRASA POR RM (DIXON)
    ============================================================ */
    function MRIFatFraction() {
      const { t } = useLang();
      const c = t.calc.mriFf;
      const [inPhase, setInPhase] = useState('');
      const [outPhase, setOutPhase] = useState('');
      const sIn = parseFloat(inPhase);
      const sOut = parseFloat(outPhase);
      const isValid = !isNaN(sIn) && !isNaN(sOut) && sIn !== 0;
      const ff = isValid ? ((sIn - sOut) / (2 * sIn)) * 100 : 0;

      const handleCopy = () => {
        const text = c.reportText(ff.toFixed(1), inPhase, outPhase);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      return (
        <div className="space-y-4 animate-in fade-in">
          <Card>
            <NumberField label={c.inPhase} placeholder={c.inPh} value={inPhase} onChange={setInPhase} />
            <NumberField label={c.outPhase} placeholder={c.outPh} value={outPhase} onChange={setOutPhase} />
          </Card>
          {isValid && (
            <Card>
              <div className="flex flex-col items-center justify-center p-4">
                <span className="text-sm text-slate-500 dark:text-slate-400 mb-1">{c.estimated}</span>
                <span className="text-4xl font-bold text-blue-600 dark:text-blue-400">{ff.toFixed(1)}%</span>
              </div>
              <CopyButton onClick={handleCopy}>{t.common.copyReport}</CopyButton>
            </Card>
          )}
          <References items={REFERENCES.mriFf} />
          <ReportBugLink calcTitle={c.title} />
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: ADRENALES - LAVADO EN TC
    ============================================================ */
    function AdrenalWashout() {
      const { t } = useLang();
      const c = t.calc.adrenalCt;
      const [nc, setNc] = useState('');
      const [ven, setVen] = useState('');
      const [del, setDel] = useState('');
      const hNc = parseFloat(nc);
      const hVen = parseFloat(ven);
      const hDel = parseFloat(del);
      const isValid = !isNaN(hNc) && !isNaN(hVen) && !isNaN(hDel);
      const apw = isValid ? ((hVen - hDel) / (hVen - hNc)) * 100 : 0;
      const rpw = isValid ? ((hVen - hDel) / hVen) * 100 : 0;
      const isAdenomaAPW = apw >= 60;
      const isAdenomaRPW = rpw >= 40;
      const isAdenoma = isAdenomaAPW || isAdenomaRPW;

      const handleCopy = () => {
        const text = c.reportText(
          nc, ven, del,
          apw.toFixed(1), isAdenomaAPW ? c.compatible : c.notSuggestive,
          rpw.toFixed(1), isAdenomaRPW ? c.compatible : c.notSuggestive
        );
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      return (
        <div className="space-y-4 animate-in fade-in">
          <Card>
            <NumberField label={c.nonContrast} value={nc} onChange={setNc} />
            <NumberField label={c.portal} value={ven} onChange={setVen} />
            <NumberField label={c.delayed} value={del} onChange={setDel} />
          </Card>
          {isValid && (
            <Card>
              <div className="grid grid-cols-2 gap-4">
                <div className="text-center p-3 bg-slate-50 dark:bg-slate-900 rounded-xl">
                  <span className="block text-xs text-slate-500 dark:text-slate-400 mb-1">{c.absolute}</span>
                  <span className={`text-xl font-bold ${isAdenomaAPW ? 'text-emerald-500' : 'text-slate-700 dark:text-slate-200'}`}>
                    {apw.toFixed(1)}%
                  </span>
                  <span className="block text-[10px] text-slate-400 mt-1">{t.common.cutoff} &ge; 60%</span>
                </div>
                <div className="text-center p-3 bg-slate-50 dark:bg-slate-900 rounded-xl">
                  <span className="block text-xs text-slate-500 dark:text-slate-400 mb-1">{c.relative}</span>
                  <span className={`text-xl font-bold ${isAdenomaRPW ? 'text-emerald-500' : 'text-slate-700 dark:text-slate-200'}`}>
                    {rpw.toFixed(1)}%
                  </span>
                  <span className="block text-[10px] text-slate-400 mt-1">{t.common.cutoff} &ge; 40%</span>
                </div>
              </div>
              <InfoBox tone={isAdenoma ? 'emerald' : 'amber'}>
                {isAdenoma ? c.adenomaCompatible : c.adenomaNot}
              </InfoBox>
              <CopyButton onClick={handleCopy}>{t.common.copyReport}</CopyButton>
            </Card>
          )}
          <References items={REFERENCES.adrenalCt} />
          <ReportBugLink calcTitle={c.title} />
        </div>
      );
    }

    /* ============================================================

    ============================================================ */
    function AdrenalCSI() {
      const { t } = useLang();
      const c = t.calc.adrenalMri;
      const [lesionIn, setLesionIn] = useState('');
      const [lesionOut, setLesionOut] = useState('');
      const [refIn, setRefIn] = useState('');
      const [refOut, setRefOut] = useState('');
      const lIn = parseFloat(lesionIn);
      const lOut = parseFloat(lesionOut);
      const rIn = parseFloat(refIn);
      const rOut = parseFloat(refOut);
      const isValid = !isNaN(lIn) && !isNaN(lOut) && !isNaN(rIn) && !isNaN(rOut) && lIn !== 0 && rOut !== 0 && rIn !== 0;
      const ratioIn = isValid ? (lIn / rIn) : 0;
      const ratioOut = isValid ? (lOut / rOut) : 0;
      const csi = isValid ? (ratioOut / ratioIn) * 100 : 0;
      const isAdenoma = csi < 71;

      const handleCopy = () => {
        const text = c.reportText(lesionIn, lesionOut, refIn, refOut, csi.toFixed(1), isAdenoma ? c.conclAdenoma : c.conclNot);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      return (
        <div className="space-y-4 animate-in fade-in">
          <Card className="space-y-5">
            <div>
              <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3 border-b border-slate-100 dark:border-slate-700 pb-2">{c.lesion}</h3>
              <div className="grid grid-cols-2 gap-3">
                <NumberField small label={c.inPhase} value={lesionIn} onChange={setLesionIn} />
                <NumberField small label={c.outPhase} value={lesionOut} onChange={setLesionOut} />
              </div>
            </div>
            <div>
              <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3 border-b border-slate-100 dark:border-slate-700 pb-2">{c.reference}</h3>
              <div className="grid grid-cols-2 gap-3">
                <NumberField small label={c.inPhase} value={refIn} onChange={setRefIn} />
                <NumberField small label={c.outPhase} value={refOut} onChange={setRefOut} />
              </div>
            </div>
          </Card>
          {isValid && (
            <Card>
              <div className="flex flex-col items-center justify-center p-2">
                <span className="text-sm text-slate-500 dark:text-slate-400 mb-1">{c.csiIndex}</span>
                <span className={`text-4xl font-bold ${isAdenoma ? 'text-emerald-500' : 'text-amber-500'}`}>{csi.toFixed(1)}%</span>
              </div>
              <InfoBox tone={isAdenoma ? 'emerald' : 'amber'}>
                {isAdenoma ? c.csiAdenoma : c.csiNot}
              </InfoBox>
              <CopyButton onClick={handleCopy}>{t.common.copyReport}</CopyButton>
            </Card>
          )}
          <References items={REFERENCES.adrenalMri} />
          <ReportBugLink calcTitle={c.title} />
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: SIDEROSIS HEPÁTICA POR RM
    ============================================================ */
    function HepaticSiderosis() {
      const { t } = useLang();
      const c = t.calc.siderosis;
      const [inputType, setInputType] = useState('t2star');
      const [val, setVal] = useState('');
      const numericVal = parseFloat(val);
      const isValid = !isNaN(numericVal) && numericVal > 0;
      let r2star = 0, t2star = 0;
      if (isValid) {
        if (inputType === 't2star') { t2star = numericVal; r2star = 1000 / t2star; }
        else { r2star = numericVal; t2star = 1000 / r2star; }
      }
      const lic = isValid ? (0.0254 * r2star) + 0.202 : 0;
      let category = '', color = '';
      if (isValid) {
        if (lic < 1.8) { category = c.catNormal; color = 'text-emerald-500'; }
        else if (lic <= 7.0) { category = c.catMild; color = 'text-amber-500'; }
        else if (lic <= 15.0) { category = c.catModerate; color = 'text-orange-500'; }
        else { category = c.catSevere; color = 'text-red-500'; }
      }

      const handleCopy = () => {
        const text = c.reportText(t2star.toFixed(2), r2star.toFixed(2), lic.toFixed(2), category);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      return (
        <div className="space-y-4 animate-in fade-in">
          <Card>
            <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-xl mb-1">
              <button
                onClick={() => { setInputType('t2star'); setVal(''); }}
                className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${inputType === 't2star' ? 'bg-white dark:bg-slate-800 shadow-sm text-blue-600 dark:text-blue-400' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}
              >
                {c.enterT2}
              </button>
              <button
                onClick={() => { setInputType('r2star'); setVal(''); }}
                className={`flex-1 py-2 text-sm font-medium rounded-lg transition-all ${inputType === 'r2star' ? 'bg-white dark:bg-slate-800 shadow-sm text-blue-600 dark:text-blue-400' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}
              >
                {c.enterR2}
              </button>
            </div>
            <NumberField
              label={`${c.valueOf} ${inputType === 't2star' ? 'T2*' : 'R2*'}`}
              placeholder={inputType === 't2star' ? 'Ej: 12.5' : 'Ej: 80'}
              value={val}
              onChange={setVal}
            />
          </Card>
          {isValid && (
            <Card>
              <div className="grid grid-cols-2 gap-4 pb-4 border-b border-slate-100 dark:border-slate-700">
                <div>
                  <span className="block text-xs text-slate-500">T2*</span>
                  <span className="text-lg font-bold">{t2star.toFixed(2)} ms</span>
                </div>
                <div>
                  <span className="block text-xs text-slate-500">R2*</span>
                  <span className="text-lg font-bold">{r2star.toFixed(2)} Hz</span>
                </div>
              </div>
              <div className="flex flex-col items-center justify-center py-2">
                <span className="text-sm text-slate-500 dark:text-slate-400 mb-1">{c.licEstimated}</span>
                <span className={`text-4xl font-bold ${color}`}>{lic.toFixed(2)}</span>
                <span className={`mt-2 font-medium px-3 py-1 rounded-full text-sm ${color.replace('text', 'bg').replace('500', '50 dark:bg-opacity-20')} ${color}`}>
                  {category}
                </span>
              </div>
              <CopyButton onClick={handleCopy}>{t.common.copyReport}</CopyButton>
            </Card>
          )}
          <References items={REFERENCES.siderosis} />
          <ReportBugLink calcTitle={c.title} />
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: GRASA TÍMICA / HIPERPLASIA
    ============================================================ */
    function ThymicFat() {
      const { t } = useLang();
      const c = t.calc.thymic;
      const [thymusIn, setThymusIn] = useState('');
      const [thymusOut, setThymusOut] = useState('');
      const [muscleIn, setMuscleIn] = useState('');
      const [muscleOut, setMuscleOut] = useState('');
      const tIn = parseFloat(thymusIn);
      const tOut = parseFloat(thymusOut);
      const mIn = parseFloat(muscleIn);
      const mOut = parseFloat(muscleOut);
      const isValid = !isNaN(tIn) && !isNaN(tOut) && !isNaN(mIn) && !isNaN(mOut) && tIn !== 0 && mIn !== 0;
      const csr = isValid ? (tOut / tIn) / (mOut / mIn) : 0;
      const sii = isValid ? ((tIn - tOut) / tIn) * 100 : 0;
      const isFatty = csr < 0.9 || sii > 9;

      const handleCopy = () => {
        const text = c.reportText(thymusIn, thymusOut, muscleIn, muscleOut, csr.toFixed(2), sii.toFixed(1), isFatty ? c.conclFatty : c.conclNotFatty);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      return (
        <div className="space-y-4 animate-in fade-in">
          <Card className="space-y-5">
            <div>
              <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3 border-b border-slate-100 dark:border-slate-700 pb-2">{c.roiThymus}</h3>
              <div className="grid grid-cols-2 gap-3">
                <NumberField small label={c.inPhase} value={thymusIn} onChange={setThymusIn} />
                <NumberField small label={c.outPhase} value={thymusOut} onChange={setThymusOut} />
              </div>
            </div>
            <div>
              <h3 className="text-sm font-semibold text-slate-700 dark:text-slate-300 mb-3 border-b border-slate-100 dark:border-slate-700 pb-2">{c.roiMuscle}</h3>
              <div className="grid grid-cols-2 gap-3">
                <NumberField small label={c.inPhase} value={muscleIn} onChange={setMuscleIn} />
                <NumberField small label={c.outPhase} value={muscleOut} onChange={setMuscleOut} />
              </div>
            </div>
          </Card>
          {isValid && (
            <Card>
              <div className="grid grid-cols-2 gap-4">
                <div className="text-center">
                  <span className="block text-xs text-slate-500 mb-1">{c.ratioCsr}</span>
                  <span className={`text-2xl font-bold ${isFatty ? 'text-emerald-500' : 'text-amber-500'}`}>{csr.toFixed(2)}</span>
                </div>
                <div className="text-center">
                  <span className="block text-xs text-slate-500 mb-1">{c.indexSii}</span>
                  <span className={`text-2xl font-bold ${isFatty ? 'text-emerald-500' : 'text-amber-500'}`}>{sii.toFixed(1)}%</span>
                </div>
              </div>
              <InfoBox tone={isFatty ? 'emerald' : 'amber'}>
                {isFatty ? c.fattyConcl : c.notFattyConcl}
              </InfoBox>
              <CopyButton onClick={handleCopy}>{t.common.copyReport}</CopyButton>
            </Card>
          )}
          <References items={REFERENCES.thymic} />
          <ReportBugLink calcTitle={c.title} />
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: ACR TI-RADS (TIROIDES)
    ============================================================ */
    const TIRADS_POINTS = {
      composition: [0, 0, 1, 2],
      echogenicity: [0, 1, 2, 3],
      shape: [0, 3],
      margin: [0, 0, 2, 3],
      echogenicFoci: [0, 1, 2, 3],
    };

    function TIRADS() {
      const { t } = useLang();
      const c = t.calc.tirads;
      const [selections, setSelections] = useState({
        composition: null, echogenicity: null, shape: null, margin: null, echogenicFoci: [],
      });

      const toggleSelection = (category, index, multi = false) => {
        setSelections(prev => {
          if (multi) {
            const current = prev[category];
            return {
              ...prev,
              [category]: current.includes(index) ? current.filter(i => i !== index) : [...current, index],
            };
          }
          return { ...prev, [category]: index };
        });
      };

      const calculatePoints = () => {
        let pts = 0;
        ['composition', 'echogenicity', 'shape', 'margin'].forEach(cat => {
          if (selections[cat] !== null) pts += TIRADS_POINTS[cat][selections[cat]];
        });
        selections.echogenicFoci.forEach(i => { pts += TIRADS_POINTS.echogenicFoci[i]; });
        return pts;
      };
      const pts = calculatePoints();

      let catKey = '', color = '';
      if (pts === 0) { catKey = 'TR1'; color = 'text-emerald-500'; }
      else if (pts <= 2) { catKey = 'TR2'; color = 'text-emerald-500'; }
      else if (pts === 3) { catKey = 'TR3'; color = 'text-amber-500'; }
      else if (pts <= 6) { catKey = 'TR4'; color = 'text-orange-500'; }
      else { catKey = 'TR5'; color = 'text-red-500'; }
      const catInfo = c.categories[catKey];

      const handleCopy = () => {
        const critEs = c.criteria;
        const label = (cat) => selections[cat] !== null ? critEs[cat].options[selections[cat]] : t.common.notEvaluated;
        const foci = selections.echogenicFoci.length
          ? selections.echogenicFoci.map(i => critEs.echogenicFoci.options[i]).join(', ')
          : t.common.none;
        const text = c.reportText(
          label('composition'), label('echogenicity'), label('shape'), label('margin'), foci,
          pts, catKey, catInfo.risk, catInfo.recs
        );
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      return (
        <div className="space-y-4 pb-28">
          {Object.entries(c.criteria).map(([key, data]) => (
            <div key={key} className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
              <h3 className="font-semibold text-slate-800 dark:text-slate-200 mb-3 text-sm">{data.title}</h3>
              <div className="space-y-2">
                {data.options.map((label, i) => {
                  const multi = key === 'echogenicFoci';
                  const isSelected = multi ? selections[key].includes(i) : selections[key] === i;
                  return (
                    <button
                      key={i}
                      onClick={() => toggleSelection(key, i, multi)}
                      className={`w-full text-left p-3 rounded-xl border text-sm transition-all ${isSelected ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-600'}`}
                    >
                      <div className="flex justify-between items-center gap-2">
                        <span>{label}</span>
                        <span className="text-xs font-medium bg-white dark:bg-slate-900 px-2 py-1 rounded-md opacity-70 shrink-0">+{TIRADS_POINTS[key][i]} {c.points}</span>
                      </div>
                    </button>
                  );
                })}
              </div>
            </div>
          ))}
          <References items={REFERENCES.tirads} />
          <ReportBugLink calcTitle={c.title} />
          <div className="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 p-4 shadow-lg z-40">
            <div className="max-w-md mx-auto flex items-center justify-between">
              <div>
                <span className="block text-xs text-slate-500 mb-0.5">{c.totalScore}: {pts}</span>
                <div className="flex items-center gap-2">
                  <span className={`font-bold text-xl ${color}`}>{catKey}</span>
                  <span className="text-sm font-medium text-slate-600 dark:text-slate-300">{catInfo.risk}</span>
                </div>
                <span className="block text-[10px] text-slate-500 mt-0.5 leading-tight">{catInfo.recs}</span>
              </div>
              <button onClick={handleCopy} className="p-3 bg-blue-100 text-blue-600 dark:bg-blue-900 dark:text-blue-300 rounded-full hover:bg-blue-200 dark:hover:bg-blue-800 transition-colors shrink-0">
                <IconCopy size={20} />
              </button>
            </div>
          </div>
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: ACR O-RADS (OVARIO)
    ============================================================ */
    function ORADS() {
      const { t } = useLang();
      const c = t.calc.orads;
      const [history, setHistory] = useState(['start']);
      const [selectedLabels, setSelectedLabels] = useState([]);
      const currentId = history[history.length - 1];
      const currentNode = currentId === 'start' ? c.start : c.nodes[currentId];
      const isResult = !!currentNode.cat;

      const handleSelect = (nextId, label) => {
        setHistory([...history, nextId]);
        setSelectedLabels([...selectedLabels, label]);
      };
      const handleReset = () => { setHistory(['start']); setSelectedLabels([]); };
      const handleUndo = () => {
        if (history.length > 1) {
          setHistory(history.slice(0, -1));
          setSelectedLabels(selectedLabels.slice(0, -1));
        }
      };
      const handleCopy = () => {
        if (!isResult) return;
        const path = selectedLabels.join(' -> ');
        const text = c.reportText(path, currentNode.cat, currentNode.risk, currentNode.recs);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      return (
        <div className="space-y-4 pb-4 animate-in fade-in">
          {history.length > 1 && (
            <div className="bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-xs text-slate-500 dark:text-slate-400">
              <div className="flex justify-between items-center mb-2">
                <span className="font-semibold uppercase">{c.history}</span>
                <button onClick={handleUndo} className="text-blue-500 font-medium">{c.undo}</button>
              </div>
              <ol className="list-decimal pl-4 space-y-1">
                {selectedLabels.map((lbl, i) => <li key={i}>{lbl}</li>)}
              </ol>
            </div>
          )}
          {!isResult ? (
            <Card>
              <h3 className="font-semibold text-slate-800 dark:text-slate-200 mb-1">{currentNode.q}</h3>
              <div className="space-y-2">
                {currentNode.options.map((opt, i) => (
                  <button
                    key={i}
                    onClick={() => handleSelect(opt.next, opt.label)}
                    className="w-full text-left p-4 rounded-xl border border-slate-200 dark:border-slate-700 text-sm text-slate-700 dark:text-slate-300 hover:border-blue-300 hover:bg-blue-50 dark:hover:border-blue-800 dark:hover:bg-blue-900/30 transition-colors flex justify-between items-center"
                  >
                    <span>{opt.label}</span>
                    <IconArrowRight size={16} className="text-slate-400 shrink-0 ml-2" />
                  </button>
                ))}
              </div>
            </Card>
          ) : (
            <div className="bg-white dark:bg-slate-800 p-6 rounded-2xl shadow-sm border border-blue-200 dark:border-blue-800 text-center space-y-4">
              <div>
                <h2 className="text-4xl font-black text-blue-600 dark:text-blue-400 mb-1">{currentNode.cat}</h2>
                <p className="text-sm font-semibold text-slate-600 dark:text-slate-300">{currentNode.risk}</p>
              </div>
              <div className="bg-blue-50 dark:bg-slate-900 p-4 rounded-xl text-sm text-slate-700 dark:text-slate-300 text-left">
                <span className="block font-semibold mb-1 text-blue-800 dark:text-blue-300">{c.recommendation}:</span>
                {currentNode.recs}
              </div>
              <div className="flex gap-2 pt-2">
                <button onClick={handleReset} className="flex-1 py-3 rounded-xl font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600 transition-colors">
                  {t.common.reset}
                </button>
                <button onClick={handleCopy} className="flex-1 flex items-center justify-center gap-2 bg-blue-600 text-white py-3 rounded-xl font-medium hover:bg-blue-700 transition-colors">
                  <IconCopy size={18} /> {t.common.copy}
                </button>
              </div>
            </div>
          )}
          <References items={REFERENCES.orads} />
          <ReportBugLink calcTitle={c.title} />
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: PI-RADS v2.1 (PRÓSTATA)
    ============================================================ */
    function PIRADS() {
      const { t } = useLang();
      const c = t.calc.pirads;
      const [zone, setZone] = useState('pz');
      const [dwi, setDwi] = useState(0);
      const [t2, setT2] = useState(0);
      const [dce, setDce] = useState('');

      let finalScore = 0;
      if (zone === 'pz') {
        if (dwi > 0) finalScore = (dwi === 3 && dce === '+') ? 4 : dwi;
      } else {
        if (t2 > 0) finalScore = (t2 === 3 && dwi === 5) ? 4 : t2;
      }

      const handleCopy = () => {
        if (!finalScore) return;
        const txtZone = zone === 'pz' ? c.pz : c.tz;
        const text = c.reportText(
          txtZone,
          dwi || c.naText,
          t2 || c.naText,
          dce === '+' ? c.dcePos : dce === '-' ? c.dceNeg : c.naText,
          finalScore
        );
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      return (
        <div className="space-y-4 animate-in fade-in pb-10">
          <div className="bg-white dark:bg-slate-800 p-2 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 flex">
            <button
              onClick={() => { setZone('pz'); setDwi(0); setT2(0); setDce(''); }}
              className={`flex-1 py-3 text-sm font-semibold rounded-xl transition-all ${zone === 'pz' ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400' : 'text-slate-500'}`}
            >
              {c.pz}
            </button>
            <button
              onClick={() => { setZone('tz'); setDwi(0); setT2(0); setDce(''); }}
              className={`flex-1 py-3 text-sm font-semibold rounded-xl transition-all ${zone === 'tz' ? 'bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-400' : 'text-slate-500'}`}
            >
              {c.tz}
            </button>
          </div>
          <Card className="space-y-6">
            {zone === 'pz' && (
              <>
                <div>
                  <h3 className="text-sm font-bold text-slate-800 dark:text-slate-200 mb-2">{c.dwiDominant}</h3>
                  <div className="flex gap-2">
                    {[1,2,3,4,5].map(s => (
                      <button key={`dwi-${s}`} onClick={() => setDwi(s)} className={`flex-1 py-2 rounded-lg font-bold border transition-colors ${dwi === s ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700'}`}>
                        {s}
                      </button>
                    ))}
                  </div>
                </div>
                {dwi === 3 && (
                  <div className="animate-in fade-in slide-in-from-top-2">
                    <h3 className="text-sm font-bold text-slate-800 dark:text-slate-200 mb-2">{c.dceStep}</h3>
                    <div className="flex gap-2">
                      <button onClick={() => setDce('-')} className={`flex-1 py-2 rounded-lg font-bold border transition-colors ${dce === '-' ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700'}`}>
                        {c.dceNeg}
                      </button>
                      <button onClick={() => setDce('+')} className={`flex-1 py-2 rounded-lg font-bold border transition-colors ${dce === '+' ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700'}`}>
                        {c.dcePos}
                      </button>
                    </div>
                    <p className="text-xs text-slate-500 mt-2">{c.dceNote}</p>
                  </div>
                )}
              </>
            )}
            {zone === 'tz' && (
              <>
                <div>
                  <h3 className="text-sm font-bold text-slate-800 dark:text-slate-200 mb-2">{c.t2Dominant}</h3>
                  <div className="flex gap-2">
                    {[1,2,3,4,5].map(s => (
                      <button key={`t2-${s}`} onClick={() => setT2(s)} className={`flex-1 py-2 rounded-lg font-bold border transition-colors ${t2 === s ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700'}`}>
                        {s}
                      </button>
                    ))}
                  </div>
                </div>
                {t2 === 3 && (
                  <div className="animate-in fade-in slide-in-from-top-2">
                    <h3 className="text-sm font-bold text-slate-800 dark:text-slate-200 mb-2">{c.dwiStep}</h3>
                    <div className="flex gap-2">
                      {[1,2,3,4,5].map(s => (
                        <button key={`dwitz-${s}`} onClick={() => setDwi(s)} className={`flex-1 py-2 rounded-lg font-bold border transition-colors ${dwi === s ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:bg-slate-50 dark:hover:bg-slate-700'}`}>
                          {s}
                        </button>
                      ))}
                    </div>
                    <p className="text-xs text-slate-500 mt-2">{c.dwiNote}</p>
                  </div>
                )}
              </>
            )}
          </Card>
          {finalScore > 0 && (
            <Card className="text-center">
              <div className="flex flex-col items-center justify-center">
                <span className="text-sm text-slate-500 font-medium mb-1">{c.finalCategory}</span>
                <span className={`text-4xl font-black ${finalScore >= 4 ? 'text-red-500' : finalScore === 3 ? 'text-amber-500' : 'text-emerald-500'}`}>
                  PI-RADS {finalScore}
                </span>
              </div>
              <CopyButton onClick={handleCopy}>{t.common.copyReport}</CopyButton>
            </Card>
          )}
          <References items={REFERENCES.pirads} />
          <ReportBugLink calcTitle={c.title} />
        </div>
      );
    }

    /* ============================================================
       LISTADO DE CALCULADORAS
    ============================================================ */
    const calculators = [
      { id: 'psad', catKey: 'abdomen', component: PSADCalculator },
      { id: 'mriFf', catKey: 'abdomen', component: MRIFatFraction },
      { id: 'adrenalCt', catKey: 'abdomen', component: AdrenalWashout },
      { id: 'adrenalMri', catKey: 'abdomen', component: AdrenalCSI },
      { id: 'siderosis', catKey: 'abdomen', component: HepaticSiderosis },
      { id: 'thymic', catKey: 'torax', component: ThymicFat },
      { id: 'tirads', catKey: 'strat', component: TIRADS },
      { id: 'orads', catKey: 'strat', component: ORADS },
      { id: 'pirads', catKey: 'strat', component: PIRADS },
    ];

    /* ============================================================
       PIE DE PÁGINA (crédito + contacto + disclaimer)
    ============================================================ */
    function SiteFooter() {
      const { t, lang } = useLang();
      return (
        <footer className="mt-10 pt-6 border-t border-slate-200 dark:border-slate-800 space-y-4 text-center">
          <p className="text-xs text-slate-400 dark:text-slate-500 leading-relaxed max-w-sm mx-auto">
            {t.common.disclaimer}
          </p>
          <div className="flex items-center justify-center gap-4 flex-wrap">
            <a
              href={LINKEDIN_URL}
              target="_blank"
              rel="noopener noreferrer"
              className="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
            >
              <IconLinkedin size={16} />
              {t.common.createdBy} Dr. Joaquín Hevia M.
            </a>
            <a
              href={buildMailto(null, lang)}
              className="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
            >
              <IconMail size={16} />
              {t.common.reportBugGeneral}
            </a>
          </div>
          <p className="text-[11px] text-slate-300 dark:text-slate-600">RadioCalc Clinical</p>
        </footer>
      );
    }

    /* ============================================================
       APP PRINCIPAL
    ============================================================ */
    function App() {
      const [darkMode, setDarkMode] = useState(true);
      const [lang, setLang] = useState('es');
      const [activeCalc, setActiveCalc] = useState(null);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', darkMode);
      }, [darkMode]);

      useEffect(() => {
        document.documentElement.lang = lang;
      }, [lang]);

      const t = STRINGS[lang];
      const toggleLang = () => setLang(l => (l === 'es' ? 'en' : 'es'));

      const activeEntry = activeCalc ? calculators.find(cc => cc.id === activeCalc) : null;
      const activeTitle = activeEntry ? t.calc[activeEntry.id].title : null;

      const categoryOrder = ['abdomen', 'torax', 'strat'];

      return (
        <LangContext.Provider value={{ lang, t, toggleLang }}>
          <div className="min-h-screen bg-slate-50 dark:bg-slate-900 pb-10">
            <header className="sticky top-0 z-50 bg-blue-600 dark:bg-slate-800 text-white shadow-md px-4 py-3 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 min-w-0">
                {activeCalc ? (
                  <button onClick={() => setActiveCalc(null)} aria-label={t.common.back} className="p-1 -ml-1 hover:bg-white/20 rounded-full transition-colors shrink-0">
                    <IconChevronLeft className="w-6 h-6" />
                  </button>
                ) : (
                  <Logo size={32} />
                )}
                <h1 className="text-base sm:text-lg font-bold tracking-tight truncate">
                  {activeTitle || t.appName}
                </h1>
              </div>
              <div className="flex items-center gap-1 shrink-0">
                <button
                  onClick={toggleLang}
                  aria-label="Toggle language"
                  className="px-2.5 py-1.5 text-xs font-bold rounded-full hover:bg-white/20 transition-colors border border-white/30"
                >
                  {lang === 'es' ? 'EN' : 'ES'}
                </button>
                <button onClick={() => setDarkMode(!darkMode)} aria-label="Toggle theme" className="p-2 hover:bg-white/20 rounded-full transition-colors">
                  {darkMode ? <IconSun /> : <IconMoon />}
                </button>
              </div>
            </header>
            <main className="max-w-md mx-auto p-4">
              {activeEntry ? (
                <div>{React.createElement(activeEntry.component)}</div>
              ) : (
                <div className="space-y-6">
                  <div className="flex flex-col items-center text-center gap-3 py-4">
                    <Logo size={56} />
                    <div>
                      <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100">{t.appName}</h2>
                      <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-xs">{t.tagline}</p>
                    </div>
                  </div>
                  {categoryOrder.map(catKey => (
                    <div key={catKey}>
                      <h2 className="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3 px-1">
                        {t.categories[catKey]}
                      </h2>
                      <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden divide-y divide-slate-100 dark:divide-slate-700">
                        {calculators.filter(cc => cc.catKey === catKey).map(cc => (
                          <button
                            key={cc.id}
                            onClick={() => setActiveCalc(cc.id)}
                            className="w-full text-left px-5 py-4 active:bg-slate-50 dark:active:bg-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors flex justify-between items-center gap-3"
                          >
                            <span className="font-medium text-slate-700 dark:text-slate-200">{t.calc[cc.id].title}</span>
                            <IconChevronLeft className="text-slate-400 transform rotate-180 w-4 h-4 shrink-0" />
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                  <SiteFooter />
                </div>
              )}
            </main>
          </div>
        </LangContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
