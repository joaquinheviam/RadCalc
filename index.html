    /* ============================================================
       CALCULADORA: CLEAR CELL LIKELIHOOD SCORE (ccLS v2)
    ============================================================ */
    function cclsCompute(t2, cmp, ans) {
      const { fat, sei, ader, dwi, homog } = ans;
      if (t2 === 'hyper' || t2 === 'iso') {
        if (cmp === 'intense') {
          if (fat === 'y') return { score: 5, diff: null };
          if (fat === 'n') {
            if (sei === 'n') return { score: 4, diff: null };
            if (sei === 'y') return { score: 3, diff: t2 === 'hyper' ? 'diffOncocytoma' : 'diffChrrccOncocytoma' };
          }
          return null;
        }
        if (cmp === 'moderate') {
          if (fat === 'y') return { score: 3, diff: null };
          if (fat === 'n') {
            if (sei === 'n') return { score: 3, diff: 'diffChrrccOncocytoma' };
            if (sei === 'y') return { score: 2, diff: 'diffOncocytoma' };
          }
          return null;
        }
        if (cmp === 'mild') {
          if (t2 === 'hyper') return { score: 3, diff: null };
          if (fat === 'y') return { score: 2, diff: null };
          if (fat === 'n') {
            if (dwi === 'n') return { score: 3, diff: null };
            if (dwi === 'y') return { score: 1, diff: 'diffPrccFpaml' };
          }
          return null;
        }
      }
      if (t2 === 'hypo') {
        if (cmp === 'mild') {
          if (fat === 'y') return { score: 3, diff: null };
          if (fat === 'n') return { score: 1, diff: 'diffPrccFpaml' };
          return null;
        }
        if (cmp === 'intense' || cmp === 'moderate') {
          if (ader === 'y') return { score: 2, diff: 'diffFpaml' };
          if (ader === 'n') {
            if (dwi === 'y') return { score: 2, diff: 'diffFpaml' };
            if (dwi === 'n') {
              if (homog === 'y') return { score: 3, diff: 'diffFpaml' };
              if (homog === 'n') return { score: 4, diff: 'diffFpaml' };
            }
          }
          return null;
        }
      }
      return null;
    }

    function CCLS() {
      const { t } = useLang();
      const c = t.calc.ccls;
      const [gate, setGate] = useState(null);
      const [t2, setT2] = useState(null);
      const [cmp, setCmp] = useState(null);
      const [fat, setFat] = useState(null);
      const [sei, setSei] = useState(null);
      const [ader, setAder] = useState(null);
      const [dwi, setDwi] = useState(null);
      const [homog, setHomog] = useState(null);

      const resetAncillary = () => { setFat(null); setSei(null); setAder(null); setDwi(null); setHomog(null); };
      const handleGate = (key) => { setGate(key); setT2(null); setCmp(null); resetAncillary(); };
      const handleT2 = (key) => { setT2(key); setCmp(null); resetAncillary(); };
      const handleCmp = (key) => { setCmp(key); resetAncillary(); };
      const handleFat = (v) => { setFat(v); setSei(null); setDwi(null); };
      const handleAder = (v) => { setAder(v); setDwi(null); setHomog(null); };
      const handleDwi = (v) => { setDwi(v); setHomog(null); };

      const showFatQ = gate === 'proceed' && t2 && cmp && !(t2 === 'hyper' && cmp === 'mild') && !(t2 === 'hypo' && cmp !== 'mild');
      const showSeiQ = showFatQ && fat === 'n' && (t2 === 'hyper' || t2 === 'iso') && (cmp === 'intense' || cmp === 'moderate');
      const showDwiMildIsoQ = showFatQ && fat === 'n' && t2 === 'iso' && cmp === 'mild';
      const showAderQ = gate === 'proceed' && t2 === 'hypo' && (cmp === 'intense' || cmp === 'moderate');
      const showDwiHypoQ = showAderQ && ader === 'n';
      const showHomogQ = showDwiHypoQ && dwi === 'n';

      const result = (t2 && cmp) ? cclsCompute(t2, cmp, { fat, sei, ader, dwi, homog }) : null;
      const likertLabel = result ? c.likert[result.score] : null;
      const diffText = result && result.diff ? c[result.diff] : null;
      const mgmtText = result ? (result.score <= 2 ? c.mgmtLow : result.score === 3 ? c.mgmtMid : c.mgmtHigh) : null;
      const scoreColor = !result ? '' : (result.score <= 2 ? 'text-emerald-500' : result.score === 3 ? 'text-amber-500' : 'text-red-500');

      const t2Label = t2 ? c.t2Options.find(o => o.key === t2).label : null;
      const cmpLabel = cmp ? c.cmpOptions.find(o => o.key === cmp).label : null;

      const handleCopy = () => {
        if (!result) return;
        const parts = [t2Label, cmpLabel];
        if (fat !== null) parts.push(`${c.fatQ.split('?')[0]}? ${fat === 'y' ? t.common.yes : t.common.no}`);
        if (sei !== null) parts.push(`${c.seiQ.split('?')[0]}? ${sei === 'y' ? t.common.yes : t.common.no}`);
        if (ader !== null) parts.push(`${c.aderQ.split('?')[0]}? ${ader === 'y' ? t.common.yes : t.common.no}`);
        if (dwi !== null) parts.push(`${c.dwiQ.split('?')[0]}? ${dwi === 'y' ? t.common.yes : t.common.no}`);
        if (homog !== null) parts.push(`${c.homogQ.split('?')[0]}? ${homog === 'y' ? t.common.yes : t.common.no}`);
        const path = parts.filter(Boolean).join('; ');
        const text = c.reportText(path, result.score, likertLabel, diffText, mgmtText);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      const handleReset = () => { setGate(null); setT2(null); setCmp(null); resetAncillary(); };

      const YesNo = ({ value, onChange }) => (
        <div className="flex gap-2">
          <button onClick={() => onChange('y')} className={`flex-1 p-2.5 rounded-lg border text-sm transition-all ${value === 'y' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{t.common.yes}</button>
          <button onClick={() => onChange('n')} className={`flex-1 p-2.5 rounded-lg border text-sm transition-all ${value === 'n' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{t.common.no}</button>
        </div>
      );

      return (
        <div className={`space-y-4 animate-in fade-in ${result ? 'pb-24' : ''}`}>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.gateQ}</label>
            <div className="space-y-2">
              <button onClick={() => handleGate('fat')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${gate === 'fat' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.gateFat}</button>
              <button onClick={() => handleGate('cystic')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${gate === 'cystic' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.gateCystic}</button>
              <button onClick={() => handleGate('proceed')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${gate === 'proceed' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.gateProceed}</button>
            </div>
          </Card>

          {gate === 'fat' && (
            <Card className="text-center border-blue-200 dark:border-blue-800">
              <h3 className="font-bold text-slate-800 dark:text-slate-100">{c.resultAmlTitle}</h3>
              <p className="text-sm text-slate-600 dark:text-slate-300 mt-2">{c.resultAmlDesc}</p>
            </Card>
          )}
          {gate === 'cystic' && (
            <Card className="text-center border-blue-200 dark:border-blue-800">
              <h3 className="font-bold text-slate-800 dark:text-slate-100">{c.resultBosniakTitle}</h3>
              <p className="text-sm text-slate-600 dark:text-slate-300 mt-2">{c.resultBosniakDesc}</p>
            </Card>
          )}

          {gate === 'proceed' && (
            <>
              <Card>
                <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.t2Label}</label>
                <div className="flex gap-2">
                  {c.t2Options.map(opt => (
                    <button key={opt.key} onClick={() => handleT2(opt.key)} className={`flex-1 p-2.5 rounded-lg border text-xs transition-all ${t2 === opt.key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{opt.label}</button>
                  ))}
                </div>
              </Card>

              {t2 && (
                <Card>
                  <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.cmpLabel}</label>
                  <div className="flex gap-2">
                    {c.cmpOptions.map(opt => (
                      <button key={opt.key} onClick={() => handleCmp(opt.key)} className={`flex-1 p-2.5 rounded-lg border text-xs transition-all ${cmp === opt.key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{opt.label}</button>
                    ))}
                  </div>
                </Card>
              )}

              {showFatQ && (
                <Card>
                  <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.fatQ}</label>
                  <YesNo value={fat} onChange={handleFat} />
                </Card>
              )}
              {showSeiQ && (
                <Card>
                  <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.seiQ}</label>
                  <YesNo value={sei} onChange={setSei} />
                </Card>
              )}
              {showDwiMildIsoQ && (
                <Card>
                  <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.dwiQ}</label>
                  <YesNo value={dwi} onChange={setDwi} />
                </Card>
              )}
              {showAderQ && (
                <Card>
                  <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.aderQ}</label>
                  <YesNo value={ader} onChange={handleAder} />
                </Card>
              )}
              {showDwiHypoQ && (
                <Card>
                  <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.dwiQ}</label>
                  <YesNo value={dwi} onChange={handleDwi} />
                </Card>
              )}
              {showHomogQ && (
                <Card>
                  <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.homogQ}</label>
                  <YesNo value={homog} onChange={setHomog} />
                </Card>
              )}

              {result && (
                <Card className="text-center">
                  <span className="text-xs text-slate-500 block mb-1">{c.resultLabel}</span>
                  <span className={`text-3xl font-black ${scoreColor}`}>{result.score}/5</span>
                  <p className={`text-sm font-semibold mt-1 ${scoreColor}`}>{likertLabel}</p>
                  {diffText && <p className="text-sm text-slate-600 dark:text-slate-300 mt-2 leading-snug">{diffText}</p>}
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-2 leading-snug">{mgmtText}</p>
                </Card>
              )}
              {!result && (
                <button onClick={handleReset} className="w-full py-2.5 rounded-xl font-medium text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600 transition-colors">
                  {t.common.reset}
                </button>
              )}
            </>
          )}
          {(gate === 'fat' || gate === 'cystic') && (
            <button onClick={handleReset} className="w-full py-2.5 rounded-xl font-medium text-sm text-slate-600 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:text-slate-200 dark:hover:bg-slate-600 transition-colors">
              {t.common.reset}
            </button>
          )}

          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.ccls} />
          <ReportBugLink calcTitle={c.title} />
          {result && (
            <StickyBar>
              <div className="min-w-0 text-left">
                <span className={`text-lg font-black block truncate ${scoreColor}`}>ccLS {result.score}/5</span>
                <span className={`text-xs font-semibold block truncate ${scoreColor}`}>{likertLabel}</span>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <ResetIconButton onClick={handleReset} label={t.common.reset} />
                <CopyIconButton onClick={handleCopy} label={t.common.copyReport} />
              </div>
            </StickyBar>
          )}
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: RIESGO DE LEIOMIOSARCOMA EN LESIÓN MIOMETRIAL
    ============================================================ */
    function LeiomyomaRisk() {
      const { t } = useLang();
      const c = t.calc.leiomyoma;
      const [step1, setStep1] = useState(null);
      const [t2, setT2] = useState(null);
      const [dw, setDw] = useState(null);
      const [adc, setAdc] = useState('');
      const [margins, setMargins] = useState(null);
      const [menop, setMenop] = useState(null);

      const handleStep1 = (v) => { setStep1(v); setT2(null); setDw(null); setAdc(''); setMargins(null); setMenop(null); };
      const handleT2 = (v) => { setT2(v); setDw(null); setAdc(''); setMargins(null); setMenop(null); };
      const handleDw = (v) => { setDw(v); setAdc(''); setMargins(null); setMenop(null); };
      const handleMargins = (v) => { setMargins(v); setMenop(null); };
      const resetAll = () => { setStep1(null); setT2(null); setDw(null); setAdc(''); setMargins(null); setMenop(null); };
      const handleBack = () => {
        if (menop !== null) { setMenop(null); return; }
        if (margins !== null) { setMargins(null); return; }
        if (adc !== '') { setAdc(''); return; }
        if (dw !== null) { setDw(null); return; }
        if (t2 !== null) { setT2(null); return; }
        if (step1 !== null) { setStep1(null); return; }
      };

      const adcNum = adc === '' ? null : parseFloat(adc);
      const adcValid = adcNum !== null && !isNaN(adcNum);

      let resultKey = null;
      if (step1 === 'no') resultKey = 'score1';
      else if (step1 === 'yes') {
        if (t2 === 'low') resultKey = 'score2';
        else if (t2 === 'highInt') {
          if (dw === 'low') resultKey = 'score2';
          else if (dw === 'high') {
            if (adcValid) {
              if (adcNum > 1.23) resultKey = 'score2';
              else if (margins === 'smooth') resultKey = 'score3';
              else if (margins === 'irregular') {
                if (menop === 'pre') resultKey = 'score4';
                else if (menop === 'post') resultKey = 'score5';
              }
            }
          }
        }
      }
      const resultObj = resultKey ? c[resultKey] : null;
      const scoreColor = !resultKey ? '' : (resultKey === 'score1' ? 'text-slate-500' : resultKey === 'score2' ? 'text-emerald-500' : resultKey === 'score3' ? 'text-amber-500' : 'text-red-500');

      const showMarginsQ = step1 === 'yes' && t2 === 'highInt' && dw === 'high' && adcValid && adcNum <= 1.23;
      const showMenopQ = showMarginsQ && margins === 'irregular';

      const handleCopy = () => {
        if (!resultObj) return;
        const parts = [];
        if (step1) parts.push(step1 === 'yes' ? c.step1Yes : c.step1No);
        if (t2) parts.push(t2 === 'low' ? c.step2Low : c.step2HighInt);
        if (dw) parts.push(dw === 'low' ? c.step3Low : c.step3High);
        if (dw === 'high' && adcValid) parts.push(`ADC ${adc} × 10⁻³ mm²/s`);
        if (margins) parts.push(margins === 'smooth' ? c.step5Smooth : c.step5Irregular);
        if (menop) parts.push(menop === 'pre' ? c.step6Pre : c.step6Post);
        const path = parts.join('; ');
        const text = c.reportText(path, resultObj.label, resultObj.ppv, resultObj.mgmt);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      return (
        <div className={`space-y-4 animate-in fade-in ${resultObj ? 'pb-24' : ''}`}>
          {step1 !== null && (
            <div className="bg-slate-100 dark:bg-slate-800 p-3 rounded-xl text-xs text-slate-500 dark:text-slate-400 flex justify-between items-center">
              <span className="font-semibold uppercase">{c.resultLabel}</span>
              <div className="flex items-center gap-3">
                <button onClick={handleBack} className="text-blue-500 font-medium">{c.stepBack}</button>
                <button onClick={resetAll} className="text-slate-500 dark:text-slate-400 font-medium">{t.common.reset}</button>
              </div>
            </div>
          )}
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.step1Q}</label>
            <div className="space-y-2">
              <button onClick={() => handleStep1('yes')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${step1 === 'yes' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.step1Yes}</button>
              <button onClick={() => handleStep1('no')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${step1 === 'no' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.step1No}</button>
            </div>
          </Card>

          {step1 === 'yes' && (
            <Card>
              <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.step2Q}</label>
              <div className="space-y-2">
                <button onClick={() => handleT2('low')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${t2 === 'low' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.step2Low}</button>
                <button onClick={() => handleT2('highInt')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${t2 === 'highInt' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.step2HighInt}</button>
              </div>
            </Card>
          )}

          {step1 === 'yes' && t2 === 'highInt' && (
            <Card>
              <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.step3Q}</label>
              <div className="space-y-2">
                <button onClick={() => handleDw('low')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${dw === 'low' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.step3Low}</button>
                <button onClick={() => handleDw('high')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${dw === 'high' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.step3High}</button>
              </div>
            </Card>
          )}

          {step1 === 'yes' && t2 === 'highInt' && dw === 'high' && (
            <Card>
              <NumberField label={c.step4Q} value={adc} onChange={setAdc} placeholder={c.step4Ph} />
            </Card>
          )}

          {showMarginsQ && (
            <Card>
              <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.step5Q}</label>
              <div className="space-y-2">
                <button onClick={() => handleMargins('smooth')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${margins === 'smooth' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.step5Smooth}</button>
                <button onClick={() => handleMargins('irregular')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${margins === 'irregular' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.step5Irregular}</button>
              </div>
            </Card>
          )}

          {showMenopQ && (
            <Card>
              <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.step6Q}</label>
              <div className="flex gap-2">
                <button onClick={() => setMenop('pre')} className={`flex-1 p-2.5 rounded-lg border text-xs transition-all ${menop === 'pre' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.step6Pre}</button>
                <button onClick={() => setMenop('post')} className={`flex-1 p-2.5 rounded-lg border text-xs transition-all ${menop === 'post' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.step6Post}</button>
              </div>
            </Card>
          )}

          {resultObj && (
            <Card className="text-center">
              <span className="text-xs text-slate-500 block mb-1">{c.resultLabel}</span>
              <span className={`text-2xl font-black ${scoreColor}`}>{resultObj.label}</span>
              {resultObj.ppv && <p className="text-sm font-semibold text-slate-600 dark:text-slate-300 mt-1">{resultObj.ppv}</p>}
              <p className="text-sm text-slate-600 dark:text-slate-300 mt-2 leading-snug">{resultObj.mgmt}</p>
            </Card>
          )}

          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.leiomyoma} />
          <ReportBugLink calcTitle={c.title} />
          {resultObj && (
            <StickyBar>
              <div className="min-w-0 text-left">
                <span className={`text-lg font-black block truncate ${scoreColor}`}>{resultObj.label}</span>
                {resultObj.ppv && <span className="text-xs text-slate-500 dark:text-slate-400 block truncate">{resultObj.ppv}</span>}
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <ResetIconButton onClick={resetAll} label={t.common.reset} />
                <CopyIconButton onClick={handleCopy} label={t.common.copyReport} />
              </div>
            </StickyBar>
          )}
        </div>
      );
    }

    /* ============================================================
       LISTADO DE CALCULADORAS
    ============================================================ */
    const calculators = [
      { id: 'psad', catKey: 'abdomen', component: PSADCalculator },
      { id: 'mriFf', catKey: 'abdomen', component: MRIFatFraction },
      { id: 'adrenalCt', catKey: 'abdomen', component: AdrenalWashout },
      { id: 'adrenalMri', catKey: 'abdomen', component: AdrenalCSI },
      { id: 'siderosis', catKey: 'abdomen', component: HepaticSiderosis },
      { id: 'thymic', catKey: 'torax', component: ThymicFat },
      { id: 'tirads', catKey: 'strat', component: TIRADS },
      { id: 'orads', catKey: 'strat', component: ORADS },
      { id: 'pirads', catKey: 'strat', component: PIRADS },
      { id: 'virads', catKey: 'strat', component: VIRADS },
      { id: 'lirads', catKey: 'strat', component: LIRADS },
      { id: 'liradsTr', catKey: 'strat', component: LIRADSTreatmentResponse },
      { id: 'cadrads', catKey: 'cardio', component: CADRADS },
      { id: 'ntmBcd', catKey: 'torax', component: NTMBcdScore },
      { id: 'peQanadli', catKey: 'torax', component: PEQanadli },
      { id: 'pancreatitisAtlanta', catKey: 'abdomen', component: PancreatitisAtlanta },
      { id: 'pancreasResect', catKey: 'abdomen', component: PancreasResect },
      { id: 'lungNodule', catKey: 'torax', component: LungNodule },
      { id: 'lungRads', catKey: 'torax', component: LungRADS },
      { id: 'lungScreening', catKey: 'torax', component: LungScreening },
      { id: 'lungCysts', catKey: 'torax', component: LungCysts },
      { id: 'bosniak', catKey: 'strat', component: Bosniak },
      { id: 'renalScore', catKey: 'gu', component: RenalScore },
      { id: 'ccls', catKey: 'gu', component: CCLS },
      { id: 'leiomyoma', catKey: 'gyn', component: LeiomyomaRisk },
    ];

    /* ============================================================
       PIE DE PÁGINA (crédito + contacto + disclaimer)
    ============================================================ */
    function SiteFooter() {
      const { t, lang } = useLang();
      return (
        <footer className="mt-10 pt-6 border-t border-slate-200 dark:border-slate-800 space-y-4 text-center">
          <p className="text-xs text-slate-400 dark:text-slate-500 leading-relaxed max-w-sm mx-auto">
            {t.common.disclaimer}
          </p>
          <div className="flex items-center justify-center gap-4 flex-wrap">
            <a
              href={LINKEDIN_URL}
              target="_blank"
              rel="noopener noreferrer"
              className="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
            >
              <IconLinkedin size={16} />
              {t.common.createdBy} Dr. Joaquín Hevia M.
            </a>
            <a
              href={buildMailto(null, lang, 'bug')}
              className="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
            >
              <IconMail size={16} />
              {t.common.reportBugGeneral}
            </a>
            <a
              href={buildMailto(null, lang, 'update')}
              className="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
            >
              <IconMail size={16} />
              {t.common.suggestUpdate}
            </a>
            <a
              href={buildMailto(null, lang, 'suggestion')}
              className="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
            >
              <IconMail size={16} />
              {t.common.suggestGeneral}
            </a>
            <button
              onClick={() => copyToClipboard(REPORT_EMAIL, t.common.emailCopiedOk, t.common.copiedErr)}
              className="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 dark:text-slate-400 hover:text-blue-600 dark:hover:text-blue-400 transition-colors"
            >
              <IconCopy size={16} />
              {t.common.copyEmail}
            </button>
          </div>
          <p className="text-[11px] text-slate-300 dark:text-slate-600">{REPORT_EMAIL} · RadioCalc Clinical</p>
        </footer>
      );
    }

    /* ============================================================
       APP PRINCIPAL
    ============================================================ */
    function App() {
      const [darkMode, setDarkMode] = useState(true);
      const [lang, setLang] = useState('es');
      const [activeCalc, setActiveCalc] = useState(null);

      useEffect(() => {
        document.documentElement.classList.toggle('dark', darkMode);
      }, [darkMode]);

      useEffect(() => {
        document.documentElement.lang = lang;
      }, [lang]);

      const t = STRINGS[lang];
      const toggleLang = () => setLang(l => (l === 'es' ? 'en' : 'es'));

      const activeEntry = activeCalc ? calculators.find(cc => cc.id === activeCalc) : null;
      const activeTitle = activeEntry ? t.calc[activeEntry.id].title : null;

      const categoryOrder = ['abdomen', 'torax', 'cardio', 'strat', 'gyn', 'gu', 'oncrecto'];

      return (
        <LangContext.Provider value={{ lang, t, toggleLang }}>
          <div className="min-h-screen bg-slate-50 dark:bg-slate-900 pb-10">
            <header className="sticky top-0 z-50 bg-blue-600 dark:bg-slate-800 text-white shadow-md px-4 py-3 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2 min-w-0">
                {activeCalc ? (
                  <button onClick={() => setActiveCalc(null)} aria-label={t.common.back} className="p-1 -ml-1 hover:bg-white/20 rounded-full transition-colors shrink-0">
                    <IconChevronLeft className="w-6 h-6" />
                  </button>
                ) : (
                  <Logo size={32} />
                )}
                <h1 className="text-base sm:text-lg font-bold tracking-tight truncate">
                  {activeTitle || t.appName}
                </h1>
              </div>
              <div className="flex items-center gap-1 shrink-0">
                <button
                  onClick={toggleLang}
                  aria-label="Toggle language"
                  className="px-2.5 py-1.5 text-xs font-bold rounded-full hover:bg-white/20 transition-colors border border-white/30"
                >
                  {lang === 'es' ? 'EN' : 'ES'}
                </button>
                <button onClick={() => setDarkMode(!darkMode)} aria-label="Toggle theme" className="p-2 hover:bg-white/20 rounded-full transition-colors">
                  {darkMode ? <IconSun /> : <IconMoon />}
                </button>
              </div>
            </header>
            <main className="max-w-md mx-auto p-4">
              {activeEntry ? (
                <div>{React.createElement(activeEntry.component)}</div>
              ) : (
                <div className="space-y-6">
                  <div className="flex flex-col items-center text-center gap-3 py-4">
                    <Logo size={56} />
                    <div>
                      <h2 className="text-lg font-bold text-slate-800 dark:text-slate-100">{t.appName}</h2>
                      <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 max-w-xs">{t.tagline}</p>
                    </div>
                  </div>
                  {categoryOrder.filter(catKey => calculators.some(cc => cc.catKey === catKey)).map(catKey => (
                    <div key={catKey}>
                      <h2 className="text-sm font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-3 px-1">
                        {t.categories[catKey]}
                      </h2>
                      <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden divide-y divide-slate-100 dark:divide-slate-700">
                        {calculators.filter(cc => cc.catKey === catKey).map(cc => (
                          <button
                            key={cc.id}
                            onClick={() => setActiveCalc(cc.id)}
                            className="w-full text-left px-5 py-4 active:bg-slate-50 dark:active:bg-slate-700/50 hover:bg-slate-50 dark:hover:bg-slate-700/50 transition-colors flex justify-between items-center gap-3"
                          >
                            <span className="font-medium text-slate-700 dark:text-slate-200">{t.calc[cc.id].title}</span>
                            <IconChevronLeft className="text-slate-400 transform rotate-180 w-4 h-4 shrink-0" />
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                  <SiteFooter />
                </div>
              )}
            </main>
          </div>
        </LangContext.Provider>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
