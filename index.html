    /* ============================================================
       CALCULADORA: LI-RADS RESPUESTA A TRATAMIENTO (LR-TR)
    ============================================================ */
    function liradsTrCatColor(key) {
      if (key === 'viable') return 'text-red-500';
      if (key === 'equivocal') return 'text-amber-500';
      if (key === 'nonprogressing') return 'text-sky-500';
      if (key === 'nonviable') return 'text-emerald-500';
      return 'text-slate-400';
    }

    function liradsTrCatBorder(key, active) {
      if (!active) return 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400';
      if (key === 'viable') return 'border-red-500 bg-red-50 dark:bg-red-500/10 text-red-700 dark:text-red-300';
      if (key === 'equivocal') return 'border-amber-500 bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-300';
      if (key === 'nonprogressing') return 'border-sky-500 bg-sky-50 dark:bg-sky-500/10 text-sky-700 dark:text-sky-300';
      if (key === 'nonviable') return 'border-emerald-500 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-300';
      return 'border-slate-500 bg-slate-50 dark:bg-slate-500/10 text-slate-700 dark:text-slate-300';
    }

    function LIRADSTreatmentResponse() {
      const { t, lang } = useLang();
      const c = t.calc.liradsTr;
      const [core, setCore] = useState(null); // 'nonradiation' | 'radiation'
      const [category, setCategory] = useState(null);
      const [afDiffusion, setAfDiffusion] = useState(false);
      const [afT2, setAfT2] = useState(false);

      const cats = core ? c.categoriesData[core] : [];
      const middleKey = core === 'nonradiation' ? 'equivocal' : (core === 'radiation' ? 'nonprogressing' : null);
      const showAfStep = category && category === middleKey;
      const afApplied = showAfStep && (afDiffusion || afT2);
      const finalCategoryKey = afApplied ? 'viable' : category;
      const finalCatObj = cats.find(x => x.key === finalCategoryKey);
      const selectedCatObj = cats.find(x => x.key === category);

      const handleCoreChange = (val) => { setCore(val); setCategory(null); setAfDiffusion(false); setAfT2(false); };
      const handleCategoryChange = (key) => { setCategory(key); setAfDiffusion(false); setAfT2(false); };

      const handleCopy = () => {
        if (!finalCatObj) return;
        const coreLabel = core === 'nonradiation' ? c.coreNonradiation : c.coreRadiation;
        const afNote = afApplied ? c.afUpgradedNote(selectedCatObj.label) : '';
        const text = c.reportText(coreLabel, finalCatObj.label, afNote);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };
      const resetAll = () => { setCore(null); setCategory(null); setAfDiffusion(false); setAfT2(false); };

      return (
        <div className={`space-y-4 animate-in fade-in ${finalCatObj ? 'pb-24' : ''}`}>
          <InfoBox tone="amber">{c.applicability}</InfoBox>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.coreLabel}</label>
            <div className="space-y-2">
              <button onClick={() => handleCoreChange('nonradiation')} className={`w-full text-left p-3 rounded-xl border text-sm transition-all ${core === 'nonradiation' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>
                <span className="font-semibold block mb-0.5">{c.coreNonradiation}</span>
                <span className="text-xs opacity-80">{c.coreNonradiationDesc}</span>
              </button>
              <button onClick={() => handleCoreChange('radiation')} className={`w-full text-left p-3 rounded-xl border text-sm transition-all ${core === 'radiation' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>
                <span className="font-semibold block mb-0.5">{c.coreRadiation}</span>
                <span className="text-xs opacity-80">{c.coreRadiationDesc}</span>
              </button>
            </div>
          </Card>
          {core && (
            <Card>
              <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.categoryLabel}</label>
              <div className="space-y-2">
                {cats.map(cat => (
                  <button key={cat.key} onClick={() => handleCategoryChange(cat.key)} className={`w-full text-left p-3 rounded-xl border text-sm transition-all ${liradsTrCatBorder(cat.key, category === cat.key)}`}>
                    <span className="font-semibold block mb-1">LR-TR {cat.label}</span>
                    <span className="text-xs opacity-90 block mb-1"><strong>{c.conceptualLabel}</strong> {cat.conceptual}</span>
                    <span className="text-xs opacity-90 block"><strong>{c.criterionLabel}</strong> {cat.criterion}</span>
                    {cat.examples && <span className="text-[11px] opacity-75 block mt-1"><strong>{c.examplesLabel}</strong> {cat.examples}</span>}
                    {cat.onlyApplies && <span className="text-[11px] opacity-75 block mt-1"><strong>{c.onlyAppliesLabel}</strong> {cat.onlyApplies}</span>}
                  </button>
                ))}
              </div>
              <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-2">{c.featureNote}</p>
            </Card>
          )}
          {showAfStep && (
            <Card className="space-y-3">
              <div>
                <h3 className="font-semibold text-slate-800 dark:text-slate-200 text-sm">{c.afStepTitle}</h3>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-snug">{c.afStepIntro[middleKey]}</p>
              </div>
              <div className="space-y-2">
                <button onClick={() => setAfDiffusion(v => !v)} className={`w-full text-left p-3 rounded-xl border text-sm transition-all flex items-center gap-2 ${afDiffusion ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>
                  {afDiffusion ? <IconCheckCircle size={16} /> : <span className="w-4" />} {c.afDiffusion}
                </button>
                <button onClick={() => setAfT2(v => !v)} className={`w-full text-left p-3 rounded-xl border text-sm transition-all flex items-center gap-2 ${afT2 ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>
                  {afT2 ? <IconCheckCircle size={16} /> : <span className="w-4" />} {c.afT2}
                </button>
              </div>
              <p className="text-[11px] text-slate-400 dark:text-slate-500 leading-snug">{c.afMriOnlyNote}</p>
            </Card>
          )}
          {finalCatObj && afApplied && (
            <InfoBox tone="amber">{c.afUpgradedNote(selectedCatObj.label)}</InfoBox>
          )}
          {finalCatObj && (
            <InfoBox tone="emerald"><strong>{c.managementLabel}</strong> {c.management[finalCatObj.key]}</InfoBox>
          )}
          {core && <p className="text-[11px] text-slate-400 dark:text-slate-500 leading-snug">{c.tiebreakNote}</p>}
          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.liradsTr} />
          <ReportBugLink calcTitle={c.title} />
          {finalCatObj && (
            <StickyBar>
              <div className="min-w-0 text-left">
                <span className={`text-xl font-black ${liradsTrCatColor(finalCatObj.key)}`}>LR-TR {finalCatObj.label}</span>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <ResetIconButton onClick={resetAll} label={t.common.reset} />
                <CopyIconButton onClick={handleCopy} label={t.common.copyReport} />
              </div>
            </StickyBar>
          )}
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: CAD-RADS 2.0 (ANGIO-TC CORONARIA)
    ============================================================ */
    function CADRADS() {
      const { t, lang } = useLang();
      const c = t.calc.cadrads;
      const [stenosis, setStenosis] = useState(null);
      const [mods, setMods] = useState({ N: false, S: false, G: false, I: false, HRP: false, E: false });
      const [pMod, setPMod] = useState('');

      const toggleMod = (key) => setMods(prev => ({ ...prev, [key]: !prev[key] }));
      const modString = [...Object.entries(mods).filter(([,v]) => v).map(([k]) => k), ...(pMod ? [pMod] : [])].join('/');
      const resultString = stenosis ? `CAD-RADS ${stenosis}${modString ? '/' + modString : ''}` : '';

      const handleCopy = () => {
        if (!stenosis) return;
        const text = c.reportText(stenosis, modString);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };

      const riskColor = !stenosis ? '' : ['0','1'].includes(stenosis) ? 'text-emerald-500' : ['2','3'].includes(stenosis) ? 'text-amber-500' : stenosis === 'N' ? 'text-slate-400' : 'text-red-500';
      const resetAll = () => { setStenosis(null); setMods({ N: false, S: false, G: false, I: false, HRP: false, E: false }); setPMod(''); };

      return (
        <div className={`space-y-4 animate-in fade-in ${stenosis ? 'pb-24' : ''}`}>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.stenosisLabel}</label>
            <div className="space-y-2">
              {c.stenosisOptions.map(opt => (
                <button
                  key={opt.key}
                  onClick={() => setStenosis(opt.key)}
                  className={`w-full text-left p-3 rounded-xl border text-sm transition-all flex justify-between items-center ${stenosis === opt.key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}
                >
                  <span>{opt.label}</span>
                  <span className="text-xs font-bold shrink-0 ml-2">{opt.key}</span>
                </button>
              ))}
            </div>
          </Card>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.modifiersLabel}</label>
            <div className="grid grid-cols-2 gap-2">
              {[['N', c.modN],['S', c.modS],['G', c.modG],['I', c.modI],['HRP', c.modHrp],['E', c.modE]].map(([key, label]) => (
                <button key={key} onClick={() => toggleMod(key)} className={`text-left p-2.5 rounded-lg border text-xs transition-all flex items-center gap-1.5 ${mods[key] ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>
                  {mods[key] ? <IconCheckCircle size={14} /> : <span className="w-3.5" />} {label}
                </button>
              ))}
            </div>
            {mods.HRP && <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-2 leading-snug">{c.modHrpHint}</p>}
          </Card>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.pModifierLabel}</label>
            <div className="space-y-2">
              <button onClick={() => setPMod('')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${pMod === '' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.pNone}</button>
              {c.pOptions.map(opt => (
                <button key={opt.key} onClick={() => setPMod(opt.key)} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${pMod === opt.key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{opt.label}</button>
              ))}
            </div>
            {pMod && <p className="text-[11px] text-slate-400 dark:text-slate-500 mt-2 leading-snug">{c.pCaveat}</p>}
          </Card>
          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.cadrads} />
          <ReportBugLink calcTitle={c.title} />
          {stenosis && (
            <StickyBar>
              <div className="min-w-0 text-left">
                <span className="text-xs text-slate-500 dark:text-slate-400 block">{c.resultLabel}</span>
                <span className={`text-xl font-black ${riskColor}`}>{resultString}</span>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <ResetIconButton onClick={resetAll} label={t.common.reset} />
                <CopyIconButton onClick={handleCopy} label={t.common.copyReport} />
              </div>
            </StickyBar>
          )}
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: SCORE BCD (MICOBACTERIAS NO TUBERCULOSAS)
    ============================================================ */
    const BCD_LOBES = ['rul', 'rml', 'rll', 'lul', 'lingula', 'lll'];

    function NTMBcdScore() {
      const { t, lang } = useLang();
      const c = t.calc.ntmBcd;
      const [lobes, setLobes] = useState(() => Object.fromEntries(BCD_LOBES.map(l => [l, { cavity: false, be: false }])));
      const hasAnyInput = Object.values(lobes).some(l => l.cavity || l.be);

      const toggle = (lobe, field) => setLobes(prev => ({ ...prev, [lobe]: { ...prev[lobe], [field]: !prev[lobe][field] } }));

      const score = Object.values(lobes).filter(l => l.cavity || l.be).length;
      let riskKey = 'low', riskLabel = c.lowRisk, riskColor = 'text-emerald-500', riskDesc = c.riskDesc.low;
      if (score >= 4) { riskKey = 'high'; riskLabel = c.highRisk; riskColor = 'text-red-500'; riskDesc = c.riskDesc.high; }
      else if (score >= 2) { riskKey = 'intermediate'; riskLabel = c.intermediateRisk; riskColor = 'text-amber-500'; riskDesc = c.riskDesc.intermediate; }

      const handleCopy = () => {
        const lobeDetail = BCD_LOBES.map(l => `${c.lobeLabels[l]}: ${[lobes[l].cavity ? c.cavityLabel : null, lobes[l].be ? c.beLabel : null].filter(Boolean).join(' + ') || '-'}`).join('; ');
        const text = c.reportText(score, riskLabel, lobeDetail);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };
      const resetAll = () => setLobes(Object.fromEntries(BCD_LOBES.map(l => [l, { cavity: false, be: false }])));

      return (
        <div className={`space-y-4 animate-in fade-in ${hasAnyInput ? 'pb-24' : ''}`}>
          <Card>
            <p className="text-xs text-slate-500 dark:text-slate-400 mb-3">{c.intro}</p>
            <div className="space-y-2">
              {BCD_LOBES.map(l => (
                <div key={l} className="flex items-center justify-between gap-2 p-2 rounded-lg bg-slate-50 dark:bg-slate-900">
                  <span className="text-sm font-medium w-16 shrink-0">{c.lobeLabels[l]}</span>
                  <div className="flex gap-2 flex-1">
                    <button onClick={() => toggle(l, 'cavity')} className={`flex-1 text-[11px] p-2 rounded-lg border transition-all ${lobes[l].cavity ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400'}`}>{c.cavityLabel}</button>
                    <button onClick={() => toggle(l, 'be')} className={`flex-1 text-[11px] p-2 rounded-lg border transition-all ${lobes[l].be ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400'}`}>{c.beLabel}</button>
                  </div>
                </div>
              ))}
            </div>
          </Card>
          {hasAnyInput && <InfoBox tone={riskKey === 'low' ? 'emerald' : 'amber'}>{riskDesc}</InfoBox>}
          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.ntmBcd} />
          <ReportBugLink calcTitle={c.title} />
          {hasAnyInput && (
            <StickyBar>
              <div className="min-w-0 text-left">
                <span className="text-xs text-slate-500 dark:text-slate-400 block">{c.scoreLabel}</span>
                <span className={`text-lg font-black ${riskColor}`}>{score}/6 — {riskLabel}</span>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <ResetIconButton onClick={resetAll} label={t.common.reset} />
                <CopyIconButton onClick={handleCopy} label={t.common.copyReport} />
              </div>
            </StickyBar>
          )}
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: TEP - ÍNDICE DE QANADLI Y RELACIÓN VD/VI
    ============================================================ */
    // Estructura fija de las 20 arterias segmentarias (10 por pulmón) usadas por
    // el modo "por segmento" del índice de Qanadli. Los ids se resuelven contra
    // c.qanadliSegmentLabels (STRINGS.es/en) para el nombre visible de cada segmento.
    const PE_QANADLI_LUNGS = [
      { key: 'right', nameKey: 'qanadliRightLung', groups: [
          { labelKey: 'qanadliLobeUpper', ids: ['rUpApical', 'rUpPosterior', 'rUpAnterior'] },
          { labelKey: 'qanadliLobeMiddle', ids: ['rMidLateral', 'rMidMedial'] },
          { labelKey: 'qanadliLobeLower', ids: ['rLowSuperior', 'rLowMedialBasal', 'rLowAnteriorBasal', 'rLowLateralBasal', 'rLowPosteriorBasal'] },
        ] },
      { key: 'left', nameKey: 'qanadliLeftLung', groups: [
          { labelKey: 'qanadliLobeUpper', ids: ['lUpApical', 'lUpPosterior', 'lUpAnterior'] },
          { labelKey: 'qanadliLobeLingula', ids: ['lLinSuperior', 'lLinInferior'] },
          { labelKey: 'qanadliLobeLower', ids: ['lLowSuperior', 'lLowMedialBasal', 'lLowAnteriorBasal', 'lLowLateralBasal', 'lLowPosteriorBasal'] },
        ] },
    ];
    const PE_QANADLI_ALL_IDS = PE_QANADLI_LUNGS.flatMap(l => l.groups.flatMap(g => g.ids));

    function PEQanadli() {
      const { t, lang } = useLang();
      const c = t.calc.peQanadli;
      const [qMode, setQMode] = useState('manual'); // 'manual' | 'segments'
      const [qScore, setQScore] = useState('');
      const [segGrades, setSegGrades] = useState(() => Object.fromEntries(PE_QANADLI_ALL_IDS.map(id => [id, 0])));
      const [rvMethod, setRvMethod] = useState('axial');
      const [rv, setRv] = useState('');
      const [lv, setLv] = useState('');

      const setSegGrade = (id, grade) => setSegGrades(prev => ({ ...prev, [id]: grade }));
      const resetSegments = () => setSegGrades(Object.fromEntries(PE_QANADLI_ALL_IDS.map(id => [id, 0])));
      const segTotal = Object.values(segGrades).reduce((a, b) => a + b, 0);

      const qVal = qMode === 'segments' ? segTotal : parseFloat(qScore);
      const hasQ = qMode === 'segments' ? true : (qScore !== '' && !isNaN(qVal));
      const qScoreDisplay = qMode === 'segments' ? String(segTotal) : qScore;
      const qPercent = hasQ ? Math.min(100, Math.max(0, (qVal / 40) * 100)) : 0;
      let qCat = '', qColor = '';
      if (hasQ) {
        if (qPercent < 25) { qCat = c.qanadliMild; qColor = 'text-emerald-500'; }
        else if (qPercent <= 50) { qCat = c.qanadliModerate; qColor = 'text-amber-500'; }
        else { qCat = c.qanadliSevere; qColor = 'text-red-500'; }
      }

      const rvVal = parseFloat(rv);
      const lvVal = parseFloat(lv);
      const hasRv = rv !== '' && lv !== '' && !isNaN(rvVal) && !isNaN(lvVal) && lvVal !== 0;
      const rvRatio = hasRv ? rvVal / lvVal : 0;
      const rvThreshold = rvMethod === 'axial' ? 1.0 : 0.9;
      const rvStrain = hasRv && rvRatio > rvThreshold;

      const handleCopy = () => {
        const text = c.reportText(
          hasQ ? qScoreDisplay : '—', hasQ ? qPercent.toFixed(0) : '—', hasQ ? qCat : t.common.notEvaluated,
          hasRv ? rvRatio.toFixed(2) : '—', hasRv ? (rvStrain ? c.rvStrainPositive : c.rvStrainNegative) : t.common.notEvaluated
        );
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };
      const resetAll = () => {
        setQMode('manual'); setQScore(''); resetSegments(); setRvMethod('axial'); setRv(''); setLv('');
      };

      const renderSegmentRow = (id) => {
        const grade = segGrades[id] ?? 0;
        const gradeTitle = grade === 0 ? c.qanadliGrade0 : grade === 1 ? c.qanadliGrade1 : c.qanadliGrade2;
        return (
          <div key={id} className="flex items-center justify-between gap-2 py-1.5">
            <span className="text-xs text-slate-600 dark:text-slate-400" title={gradeTitle}>{c.qanadliSegmentLabels[id]}</span>
            <div className="flex bg-slate-100 dark:bg-slate-900 p-0.5 rounded-lg shrink-0">
              {[0, 1, 2].map(g => (
                <button
                  key={g}
                  type="button"
                  onClick={() => setSegGrade(id, g)}
                  title={g === 0 ? c.qanadliGrade0 : g === 1 ? c.qanadliGrade1 : c.qanadliGrade2}
                  className={`w-7 h-7 rounded-md text-xs font-bold transition-all ${grade === g ? (g === 0 ? 'bg-emerald-500 text-white shadow-sm' : g === 1 ? 'bg-amber-500 text-white shadow-sm' : 'bg-red-500 text-white shadow-sm') : 'text-slate-400 dark:text-slate-500'}`}
                >{g}</button>
              ))}
            </div>
          </div>
        );
      };

      return (
        <div className={`space-y-4 animate-in fade-in ${(hasQ || hasRv) ? 'pb-24' : ''}`}>
          <Card>
            <h3 className="font-semibold text-slate-800 dark:text-slate-200 mb-2 text-sm">{c.qanadliSectionTitle}</h3>
            <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-lg mb-3">
              <button onClick={() => setQMode('manual')} className={`flex-1 px-3 py-1.5 rounded-md text-xs ${qMode === 'manual' ? 'bg-white dark:bg-slate-700 shadow-sm font-medium text-slate-900 dark:text-white' : 'text-slate-500'}`}>{c.qanadliModeManual}</button>
              <button onClick={() => setQMode('segments')} className={`flex-1 px-3 py-1.5 rounded-md text-xs ${qMode === 'segments' ? 'bg-white dark:bg-slate-700 shadow-sm font-medium text-slate-900 dark:text-white' : 'text-slate-500'}`}>{c.qanadliModeSegments}</button>
            </div>
            {qMode === 'manual' ? (
              <NumberField label={c.qanadliScoreLabel} placeholder="Ej: 18" value={qScore} onChange={setQScore} />
            ) : (
              <div className="space-y-3">
                <p className="text-xs text-slate-500 dark:text-slate-400 leading-snug">{c.qanadliSegmentHint}</p>
                <div className="flex items-center gap-3 text-[10px] text-slate-400 dark:text-slate-500">
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-emerald-500 inline-block"></span>{c.qanadliGrade0}</span>
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span>{c.qanadliGrade1}</span>
                  <span className="flex items-center gap-1"><span className="w-2.5 h-2.5 rounded-full bg-red-500 inline-block"></span>{c.qanadliGrade2}</span>
                </div>
                {PE_QANADLI_LUNGS.map(lung => {
                  const lungTotal = lung.groups.flatMap(g => g.ids).reduce((s, id) => s + (segGrades[id] || 0), 0);
                  return (
                    <Accordion key={lung.key} title={`${c[lung.nameKey]} (${lungTotal}/20)`}>
                      <div className="space-y-3">
                        {lung.groups.map(group => (
                          <div key={group.labelKey + lung.key}>
                            <span className="text-[11px] font-semibold uppercase tracking-wide text-slate-400 dark:text-slate-500">{c[group.labelKey]}</span>
                            <div className="mt-1 divide-y divide-slate-100 dark:divide-slate-700">
                              {group.ids.map(id => renderSegmentRow(id))}
                            </div>
                          </div>
                        ))}
                      </div>
                    </Accordion>
                  );
                })}
                <button type="button" onClick={resetSegments} className="text-xs text-slate-400 hover:text-red-500 transition-colors underline">{c.qanadliResetLabel}</button>
              </div>
            )}
            <Accordion title={c.qanadliHowTitle}>
              <p className="text-xs text-slate-500 dark:text-slate-400 leading-snug">{c.qanadliHow}</p>
            </Accordion>
          </Card>
          {hasQ && (
            <Card className="text-center">
              <span className="text-xs text-slate-500 block mb-1">{c.qanadliPercent}</span>
              <span className={`text-3xl font-black ${qColor}`}>{qPercent.toFixed(0)}% <span className="text-base font-semibold">({qScoreDisplay}/40)</span></span>
              <p className={`text-sm font-semibold mt-1 ${qColor}`}>{qCat}</p>
            </Card>
          )}
          <Card>
            <h3 className="font-semibold text-slate-800 dark:text-slate-200 mb-2 text-sm">{c.rvSectionTitle}</h3>
            <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-lg mb-3">
              <button onClick={() => setRvMethod('axial')} className={`flex-1 px-3 py-1.5 rounded-md text-xs ${rvMethod === 'axial' ? 'bg-white dark:bg-slate-700 shadow-sm font-medium text-slate-900 dark:text-white' : 'text-slate-500'}`}>{c.rvMethodAxial}</button>
              <button onClick={() => setRvMethod('fourChamber')} className={`flex-1 px-3 py-1.5 rounded-md text-xs ${rvMethod === 'fourChamber' ? 'bg-white dark:bg-slate-700 shadow-sm font-medium text-slate-900 dark:text-white' : 'text-slate-500'}`}>{c.rvMethodFourChamber}</button>
            </div>
            <div className="grid grid-cols-2 gap-2">
              <NumberField small label={c.rvLabel} value={rv} onChange={setRv} />
              <NumberField small label={c.lvLabel} value={lv} onChange={setLv} />
            </div>
          </Card>
          {hasRv && (
            <Card className="text-center">
              <span className="text-xs text-slate-500 block mb-1">{c.rvRatio}</span>
              <span className={`text-3xl font-black flex items-center justify-center gap-2 ${rvStrain ? 'text-red-500' : 'text-emerald-500'}`}>
                {rvStrain ? <IconAlertTriangle size={22} /> : <IconCheckCircle size={22} />}
                {rvRatio.toFixed(2)}
              </span>
              <p className={`text-sm font-semibold mt-1 ${rvStrain ? 'text-red-500' : 'text-emerald-500'}`}>{rvStrain ? c.rvStrainPositive : c.rvStrainNegative}</p>
            </Card>
          )}
          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.peQanadli} />
          <ReportBugLink calcTitle={c.title} />
          {(hasQ || hasRv) && (
            <StickyBar>
              <div className="min-w-0 text-left flex items-center gap-3">
                {hasQ && (
                  <div>
                    <span className="text-[10px] text-slate-500 dark:text-slate-400 block">{c.qanadliPercent}</span>
                    <span className={`text-lg font-black ${qColor}`}>{qPercent.toFixed(0)}%</span>
                  </div>
                )}
                {hasRv && (
                  <div>
                    <span className="text-[10px] text-slate-500 dark:text-slate-400 block">{c.rvRatio}</span>
                    <span className={`text-lg font-black ${rvStrain ? 'text-red-500' : 'text-emerald-500'}`}>{rvRatio.toFixed(2)}</span>
                  </div>
                )}
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <ResetIconButton onClick={resetAll} label={t.common.reset} />
                <CopyIconButton onClick={handleCopy} label={t.common.copyReport} />
              </div>
            </StickyBar>
          )}
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: PANCREATITIS AGUDA - ATLANTA REVISADA
    ============================================================ */
    function PancreatitisAtlanta() {
      const { t, lang } = useLang();
      const c = t.calc.pancreatitisAtlanta;
      const [necrosis, setNecrosis] = useState(null); // null | false | 'parenchymal'|'peripancreatic'|'combined'
      const [necrosisExtent, setNecrosisExtent] = useState(null); // null | 'under30' | 'over30'
      const [collection, setCollection] = useState(null); // null | 'none' | 'early' | 'late'
      const [organFailure, setOrganFailure] = useState(null); // null | 'none'|'transient'|'persistent'
      const [localComplications, setLocalComplications] = useState(null); // null | true | false

      const isNecrotizing = necrosis && necrosis !== 'none-selected' && necrosis !== false;
      const morphResult = necrosis === false
        ? c.morphResultInterstitial
        : (isNecrotizing ? c.necrosisSubtypes[necrosis] : null);
      const necrosisExtentLabel = isNecrotizing ? (necrosisExtent === 'under30' ? c.necrosisExtentUnder30 : necrosisExtent === 'over30' ? c.necrosisExtentOver30 : null) : null;

      let collectionResult = null;
      if (collection === 'early') collectionResult = isNecrotizing ? c.collectionResults.anc : c.collectionResults.apfc;
      else if (collection === 'late') collectionResult = isNecrotizing ? c.collectionResults.won : c.collectionResults.pseudocyst;

      let severityResult = null;
      if (organFailure) {
        if (organFailure === 'persistent') severityResult = c.severityResults.severe;
        else if (organFailure === 'transient' || localComplications) severityResult = c.severityResults.moderate;
        else if (organFailure === 'none' && localComplications === false) severityResult = c.severityResults.mild;
      }

      const handleCopy = () => {
        const text = c.reportText(
          morphResult ? morphResult.label : t.common.notEvaluated,
          necrosisExtentLabel,
          collectionResult ? collectionResult.label : c.collectionNone,
          severityResult ? severityResult.label : t.common.notEvaluated
        );
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };
      const resetAll = () => {
        setNecrosis(null); setNecrosisExtent(null); setCollection(null); setOrganFailure(null); setLocalComplications(null);
      };
      const hasAnyResult = !!(morphResult || collectionResult || severityResult);

      return (
        <div className={`space-y-4 animate-in fade-in ${hasAnyResult ? 'pb-24' : ''}`}>
          <Card>
            <h3 className="font-semibold text-slate-800 dark:text-slate-200 mb-2 text-sm">{c.morphTitle}</h3>
            <p className="text-xs text-slate-500 dark:text-slate-400 mb-2">{c.morphQ}</p>
            <div className="space-y-2">
              <button onClick={() => setNecrosis(false)} className={`w-full text-left p-2.5 rounded-lg border text-sm transition-all ${necrosis === false ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.morphNo}</button>
              <button onClick={() => setNecrosis('combined')} className={`w-full text-left p-2.5 rounded-lg border text-sm transition-all ${isNecrotizing ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.morphYes}</button>
            </div>
            {isNecrotizing && (
              <div className="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700">
                <p className="text-xs text-slate-500 dark:text-slate-400 mb-2">{c.necrosisSubtypeQ}</p>
                <div className="space-y-2">
                  {Object.entries(c.necrosisSubtypes).map(([key, opt]) => (
                    <button key={key} onClick={() => setNecrosis(key)} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${necrosis === key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>
                      <span className="font-semibold block">{opt.label}</span>
                      <span className="opacity-80">{opt.desc}</span>
                    </button>
                  ))}
                </div>
              </div>
            )}
            {isNecrotizing && (
              <div className="mt-3 pt-3 border-t border-slate-100 dark:border-slate-700">
                <p className="text-xs text-slate-500 dark:text-slate-400 mb-2">{c.necrosisExtentQ}</p>
                <div className="flex gap-2">
                  <button onClick={() => setNecrosisExtent('under30')} className={`flex-1 p-2.5 rounded-lg border text-xs transition-all ${necrosisExtent === 'under30' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.necrosisExtentUnder30}</button>
                  <button onClick={() => setNecrosisExtent('over30')} className={`flex-1 p-2.5 rounded-lg border text-xs transition-all ${necrosisExtent === 'over30' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.necrosisExtentOver30}</button>
                </div>
              </div>
            )}
          </Card>
          {morphResult && (
            <InfoBox tone="amber">{morphResult.desc}</InfoBox>
          )}
          {necrosis !== null && (
            <Card>
              <h3 className="font-semibold text-slate-800 dark:text-slate-200 mb-2 text-sm">{c.collectionTitle}</h3>
              <p className="text-xs text-slate-500 dark:text-slate-400 mb-2">{c.collectionQ}</p>
              <div className="space-y-2">
                <button onClick={() => setCollection('none')} className={`w-full text-left p-2.5 rounded-lg border text-sm transition-all ${collection === 'none' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.collectionNone}</button>
                <button onClick={() => setCollection('early')} className={`w-full text-left p-2.5 rounded-lg border text-sm transition-all ${collection === 'early' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.collectionEarly}</button>
                <button onClick={() => setCollection('late')} className={`w-full text-left p-2.5 rounded-lg border text-sm transition-all ${collection === 'late' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.collectionLate}</button>
              </div>
            </Card>
          )}
          {collectionResult && (
            <Card className="text-center">
              <span className="text-lg font-bold text-blue-600 dark:text-blue-400">{collectionResult.label}</span>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-snug">{collectionResult.desc}</p>
            </Card>
          )}
          <Card>
            <h3 className="font-semibold text-slate-800 dark:text-slate-200 mb-1 text-sm">{c.severityTitle}</h3>
            <p className="text-xs text-slate-500 dark:text-slate-400 mb-3">{c.severityIntro}</p>
            <label className="block text-xs text-slate-500 dark:text-slate-400 mb-1">{c.organFailureQ}</label>
            <div className="space-y-2 mb-3">
              <button onClick={() => setOrganFailure('none')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${organFailure === 'none' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.organFailureNone}</button>
              <button onClick={() => setOrganFailure('transient')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${organFailure === 'transient' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.organFailureTransient}</button>
              <button onClick={() => setOrganFailure('persistent')} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${organFailure === 'persistent' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.organFailurePersistent}</button>
            </div>
            {organFailure === 'none' && (
              <>
                <label className="block text-xs text-slate-500 dark:text-slate-400 mb-1">{c.localComplicationsQ}</label>
                <div className="flex gap-2">

    /* ============================================================
       CALCULADORA: NÓDULO PULMONAR INCIDENTAL (FLEISCHNER / NCCN)
    ============================================================ */
    function fleischnerRec(c, type, count, risk, size) {
      if (type === 'solid') {
        if (count === 'single') {
          if (size < 6) return risk === 'high' ? c.recs.optionalCt12 : c.recs.none;
          if (size <= 8) return risk === 'high' ? c.recs.soloSolid6to8High : c.recs.soloSolid6to8Low;
          return c.recs.soloSolidOver8;
        }
        if (size < 6) return risk === 'high' ? c.recs.optionalCt12 : c.recs.none;
        return risk === 'high' ? c.recs.multipleSolidGeq6High : c.recs.multipleSolidGeq6Low;
      }
      if (type === 'ggn') {
        if (count === 'single') return size < 6 ? c.recs.none : c.recs.ggnFollow;
        return size < 6 ? c.recs.multiSubsolidUnder6 : c.recs.multiSubsolidGeq6;
      }
      // partSolid
      if (count === 'single') return size < 6 ? c.recs.none : c.recs.partSolidFollow;
      return size < 6 ? c.recs.multiSubsolidUnder6 : c.recs.multiSubsolidGeq6;
    }

    // NCCN incidental-nodule table (v6.2026, DIAG-2/DIAG-3) as an interactive equivalent to fleischnerRec().
    // Note: unlike Fleischner, the NCCN table does not distinguish single vs multiple for solid nodules.
    function nccnRec(c, type, count, risk, size) {
      if (type === 'solid') {
        if (size < 6) return risk === 'high' ? c.nccnRecs.solidHighUnder6 : c.nccnRecs.none;
        if (size <= 8) return risk === 'high' ? c.nccnRecs.solidHighMid : c.nccnRecs.solidLowMid;
        return c.nccnRecs.solidOver8;
      }
      if (type === 'ggn') {
        if (count === 'single') return size < 6 ? c.nccnRecs.none : c.nccnRecs.ggnSoloFollow;
        return size < 6 ? c.nccnRecs.multiSubsolidUnder6 : c.nccnRecs.multiSubsolidGeq6;
      }
      // partSolid
      if (count === 'single') return size < 6 ? c.nccnRecs.none : c.nccnRecs.partSolidSoloFollow;
      return size < 6 ? c.nccnRecs.multiSubsolidUnder6 : c.nccnRecs.multiSubsolidGeq6;
    }

    function LungNodule() {
      const { t, lang } = useLang();
      const c = t.calc.lungNodule;
      // Paso 1: cribado de nódulo perifisural (PFN / ganglio linfático intrapulmonar), Schreuder et al. 2020.
      // pfnStage: 'gate1' | 'gate2' | 'gate3' | 'result-pfn' | 'result-notpfn' | 'skipped'
      const [pfnHistory, setPfnHistory] = useState(['gate1']);
      const pfnStage = pfnHistory[pfnHistory.length - 1];
      const goPfn = (stage) => setPfnHistory(h => [...h, stage]);
      const pfnBack = () => setPfnHistory(h => h.length > 1 ? h.slice(0, -1) : h);
      const pfnReset = () => setPfnHistory(['gate1']);
      const [type, setType] = useState('solid');
      const [count, setCount] = useState('single');
      const [risk, setRisk] = useState('low');
      const [size, setSize] = useState('');
      const [framework, setFramework] = useState('fleischner'); // 'fleischner' | 'nccn'

      const resetAll = () => {
        pfnReset(); setType('solid'); setCount('single'); setRisk('low'); setSize(''); setFramework('fleischner');
      };

      const sizeNum = parseFloat(size);
      const hasSize = size !== '' && !isNaN(sizeNum);
      const rec = hasSize ? (framework === 'nccn' ? nccnRec(c, type, count, risk, sizeNum) : fleischnerRec(c, type, count, risk, sizeNum)) : null;
      const resultLabel = framework === 'nccn' ? c.nccnResult : c.fleischnerResult;
      const frameworkLabel = framework === 'nccn' ? c.frameworkNccn : c.frameworkFleischner;

      const typeLabelText = type === 'solid' ? c.typeSolid : type === 'partSolid' ? c.typePartSolid : c.typeGgn;
      const countLabelText = count === 'single' ? c.countSingle : c.countMultiple;
      const riskLabelText = risk === 'high' ? c.riskHigh : c.riskLow;

      const handleCopy = () => {

    /* ============================================================
       CALCULADORA: ELEGIBILIDAD PARA TAMIZAJE DE CÁNCER PULMONAR (NCCN)
    ============================================================ */
    function LungScreening() {
      const { t, lang } = useLang();
      const c = t.calc.lungScreening;
      const [excluded, setExcluded] = useState(null); // null | true | false
      const [age, setAge] = useState('');
      const [packYears, setPackYears] = useState('');
      const [smokingYears, setSmokingYears] = useState('');

      const ageNum = parseFloat(age);
      const pyNum = parseFloat(packYears);
      const syNum = parseFloat(smokingYears);
      const hasAge = age !== '' && !isNaN(ageNum);

      let result = null;
      if (excluded === true) {
        result = { label: c.resultNotEligible, desc: c.resultNotEligibleDesc, tone: 'red' };
      } else if (excluded === false && hasAge) {
        const meetsCat1 = ageNum >= 50 && !isNaN(pyNum) && pyNum >= 20;
        const meetsCat2b = ageNum >= 50 && !meetsCat1 && !isNaN(syNum) && syNum >= 20;
        if (meetsCat1 || meetsCat2b) {
          result = { label: c.resultHigherRisk, desc: meetsCat1 ? c.resultHigherRiskCat1 : c.resultHigherRiskCat2b, note: c.resultHigherRiskNote, tone: 'emerald' };
        } else {
          result = { label: c.resultLowerRisk, desc: c.resultLowerRiskDesc, tone: 'slate' };
        }
      }

      const handleCopy = () => {
        if (!result) return;
        const text = c.reportText(age, packYears, smokingYears, result.label, result.desc);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };
      const resetAll = () => {
        setExcluded(null); setAge(''); setPackYears(''); setSmokingYears('');
      };

      const toneClass = !result ? '' : result.tone === 'red' ? 'text-red-500' : result.tone === 'emerald' ? 'text-emerald-500' : 'text-slate-400';

      return (
        <div className={`space-y-4 animate-in fade-in ${result ? 'pb-24' : ''}`}>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.exclusionQ}</label>
            <ul className="text-xs text-slate-500 dark:text-slate-400 list-disc list-inside space-y-1 mb-3">
              {c.exclusionOptions.map((opt, i) => <li key={i}>{opt}</li>)}
            </ul>
            <div className="flex gap-2">
              <button onClick={() => setExcluded(true)} className={`flex-1 p-2.5 rounded-lg border text-sm transition-all ${excluded === true ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.exclusionYes}</button>
              <button onClick={() => setExcluded(false)} className={`flex-1 p-2.5 rounded-lg border text-sm transition-all ${excluded === false ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{c.exclusionNo}</button>
            </div>
          </Card>
          {excluded === false && (
            <Card>
              <NumberField label={c.ageLabel} placeholder="55" value={age} onChange={setAge} />
              <NumberField label={c.packYearsLabel} placeholder="30" value={packYears} onChange={setPackYears} />
              <NumberField label={c.smokingYearsLabel} placeholder="25" value={smokingYears} onChange={setSmokingYears} />
            </Card>
          )}
          {result && (
            <Card className="text-center">
              <span className={`text-xl font-black ${toneClass}`}>{result.label}</span>
              <p className="text-sm text-slate-600 dark:text-slate-300 mt-2 leading-snug">{result.desc}</p>
              {result.note && <p className="text-xs text-slate-400 dark:text-slate-500 mt-2 leading-snug">{result.note}</p>}
            </Card>
          )}
          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.lungScreening} />
          <ReportBugLink calcTitle={c.title} />
          {result && (
            <StickyBar>
              <div className="min-w-0 text-left">
                <span className={`text-lg font-black block truncate ${toneClass}`}>{result.label}</span>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <ResetIconButton onClick={resetAll} label={t.common.reset} />
                <CopyIconButton onClick={handleCopy} label={t.common.copyReport} />
              </div>
            </StickyBar>
          )}
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: RESECABILIDAD DE ADENOCARCINOMA PANCREÁTICO (NCCN)
    ============================================================ */
    const PANCREAS_LEVEL = { none: 0, borderline: 1, locallyAdvanced: 2 };

    function PancreasResect() {
      const { t, lang } = useLang();
      const c = t.calc.pancreasResect;
      const [arterial, setArterial] = useState(null);
      const [venous, setVenous] = useState(null);

      const arterialObj = c.arterialOptions.find(x => x.key === arterial);
      const venousObj = c.venousOptions.find(x => x.key === venous);

      let resultKey = null;
      if (arterial && venous) {
        const level = Math.max(PANCREAS_LEVEL[arterial], PANCREAS_LEVEL[venous]);
        resultKey = level === 0 ? 'resectable' : (level === 1 ? 'borderline' : 'locallyAdvanced');
      }
      const resultObj = resultKey ? c[resultKey] : null;

      const handleCopy = () => {
        if (!resultObj) return;
        const text = c.reportText(arterialObj.label, venousObj.label, resultObj.label, resultObj.mgmt);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };
      const resetAll = () => { setArterial(null); setVenous(null); };

      const resultColor = resultKey === 'resectable' ? 'text-emerald-500' : resultKey === 'borderline' ? 'text-amber-500' : 'text-red-500';

      return (
        <div className={`space-y-4 animate-in fade-in ${resultObj ? 'pb-24' : ''}`}>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.arterialLabel}</label>
            <div className="space-y-2">
              {c.arterialOptions.map(opt => (
                <button key={opt.key} onClick={() => setArterial(opt.key)} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${arterial === opt.key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{opt.label}</button>
              ))}
            </div>
          </Card>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.venousLabel}</label>
            <div className="space-y-2">
              {c.venousOptions.map(opt => (
                <button key={opt.key} onClick={() => setVenous(opt.key)} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${venous === opt.key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{opt.label}</button>
              ))}
            </div>
          </Card>
          {resultObj && (
            <Card className="text-center">
              <span className="text-xs text-slate-500 block mb-1">{c.resultLabel}</span>
              <span className={`text-2xl font-black ${resultColor}`}>{resultObj.label}</span>
              <p className="text-sm text-slate-600 dark:text-slate-300 mt-2 leading-snug">{resultObj.mgmt}</p>
            </Card>
          )}
          <InfoBox tone="amber">{c.m0Note}</InfoBox>
          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.pancreasResect} />
          <ReportBugLink calcTitle={c.title} />
          {resultObj && (
            <StickyBar>
              <div className="min-w-0 text-left">
                <span className={`text-lg font-black block truncate ${resultColor}`}>{resultObj.label}</span>
                <span className="text-xs text-slate-500 dark:text-slate-400 block truncate">{c.resultLabel}</span>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <ResetIconButton onClick={resetAll} label={t.common.reset} />
                <CopyIconButton onClick={handleCopy} label={t.common.copyReport} />
              </div>
            </StickyBar>
          )}
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: SCORE DE NEFROMETRÍA R.E.N.A.L.
    ============================================================ */
    function RenalScore() {
      const { t } = useLang();
      const c = t.calc.renalScore;
      const [radius, setRadius] = useState('');
      const [exo, setExo] = useState(null);
      const [near, setNear] = useState('');
      const [loc, setLoc] = useState(null);
      const [ant, setAnt] = useState(null);
      const [hilar, setHilar] = useState(false);

      const radiusNum = radius === '' ? null : parseFloat(radius);
      const nearNum = near === '' ? null : parseFloat(near);
      const rPts = radiusNum === null || isNaN(radiusNum) ? null : (radiusNum <= 4 ? 1 : radiusNum < 7 ? 2 : 3);
      const ePts = exo ? c.exoOptions.find(o => o.key === exo).pts : null;
      const nPts = nearNum === null || isNaN(nearNum) ? null : (nearNum >= 7 ? 1 : nearNum > 4 ? 2 : 3);
      const lPts = loc ? c.locOptions.find(o => o.key === loc).pts : null;

      const canCompute = rPts !== null && ePts !== null && nPts !== null && lPts !== null;
      const total = canCompute ? rPts + ePts + nPts + lPts : null;
      const risk = total === null ? null : (total <= 6 ? c.riskLow : total <= 9 ? c.riskIntermediate : c.riskHigh);
      const riskColor = total === null ? '' : (total <= 6 ? 'text-emerald-500' : total <= 9 ? 'text-amber-500' : 'text-red-500');
      const antLetter = ant || 'x';
      const formula = canCompute ? `R${rPts}E${ePts}N${nPts}A${antLetter}L${lPts}` : null;
      const suffix = hilar ? 'h' : '';

      const handleCopy = () => {
        if (!canCompute) return;
        const text = c.reportText(formula + suffix, total, risk);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };
      const resetAll = () => {
        setRadius(''); setExo(null); setNear(''); setLoc(null); setAnt(null); setHilar(false);
      };

      return (
        <div className={`space-y-4 animate-in fade-in ${canCompute ? 'pb-24' : ''}`}>
          <Card>
            <NumberField label={c.radiusLabel} value={radius} onChange={setRadius} placeholder={c.radiusPh} />
          </Card>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.exoLabel}</label>
            <div className="space-y-2">
              {c.exoOptions.map(opt => (
                <button key={opt.key} onClick={() => setExo(opt.key)} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${exo === opt.key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{opt.label}</button>
              ))}
            </div>
          </Card>
          <Card>
            <NumberField label={c.nearLabel} value={near} onChange={setNear} placeholder={c.nearPh} />
          </Card>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.locLabel}</label>
            <div className="space-y-2">
              {c.locOptions.map(opt => (
                <button key={opt.key} onClick={() => setLoc(opt.key)} className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${loc === opt.key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{opt.label}</button>
              ))}
            </div>
          </Card>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.anteriorLabel}</label>
            <div className="flex gap-2">
              {c.anteriorOptions.map(opt => (
                <button key={opt.key} onClick={() => setAnt(opt.key)} className={`flex-1 p-2.5 rounded-lg border text-xs transition-all ${ant === opt.key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{opt.label}</button>
              ))}
            </div>
          </Card>
          <Card>
            <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.hilarLabel}</label>
            <div className="flex gap-2">
              <button onClick={() => setHilar(true)} className={`flex-1 p-2.5 rounded-lg border text-sm transition-all ${hilar === true ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{t.common.yes}</button>

          )}

          {canCompute && (

                <span className="text-lg font-black text-slate-800 dark:text-slate-100 block truncate">{formula}{suffix} = {total}</span>
