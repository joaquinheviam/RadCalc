<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Calculadoras radiológicas clínicas: PSAD, fracción grasa por RM, lavado adrenal, siderosis hepática, TI-RADS, O-RADS, PI-RADS y más. / Clinical radiology calculators: PSAD, MRI fat fraction, adrenal washout, hepatic siderosis, TI-RADS, O-RADS, PI-RADS and more.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>RadioCalc Clinical</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%232563eb'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='9' fill='none' stroke='white' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='white' stroke-opacity='0.55' stroke-width='3'/%3E%3Ccircle cx='32' cy='32' r='3.4' fill='white'/%3E%3C/svg%3E">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {} }
    }
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    body { -webkit-tap-highlight-color: transparent; font-family: system-ui, -apple-system, sans-serif; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .refs-enter { animation: fadeIn 0.2s ease-in-out; }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-50 min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useContext, createContext } = React;

    /* ============================================================
       IDIOMA / LANGUAGE
    ============================================================ */
    const LangContext = createContext({ lang: 'es', t: null, toggleLang: () => {} });
    const useLang = () => useContext(LangContext);

    /* ============================================================
       UTILIDADES
    ============================================================ */
    const copyToClipboard = async (text, msgOk, msgErr) => {
      try {
        await navigator.clipboard.writeText(text);
        alert(msgOk);
      } catch (err) {
        alert(msgErr);
      }
    };

    const REPORT_EMAIL = 'drjoaquinhevia@gmail.com';
    const LINKEDIN_URL = 'https://www.linkedin.com/in/joaqu%C3%ADn-hevia-morel-07421675/';

    // type: 'bug' (reportar error) | 'update' (sugerir actualización) | 'suggestion' (sugerencia general)
    const buildMailto = (calcTitle, lang, type = 'bug') => {
      const page = calcTitle || (lang === 'es' ? '(general del sitio)' : '(general site issue)');
      const templates = {
        es: {
          bug: {
            subject: `RadioCalc Clinical - Reporte de error${calcTitle ? ' (' + calcTitle + ')' : ''}`,
            body: `Hola Dr. Hevia,\n\nEncontré un posible error en la calculadora: ${page}.\n\nDescripción del problema:\n- \n\nValores ingresados (si aplica):\n- \n\nResultado esperado vs. obtenido:\n- \n\nGracias.`,
          },
          update: {
            subject: `RadioCalc Clinical - Sugerencia de actualización${calcTitle ? ' (' + calcTitle + ')' : ''}`,
            body: `Hola Dr. Hevia,\n\nCreo que la calculadora "${page}" podría actualizarse (nueva guía, versión de consenso, referencia más reciente, etc.).\n\nDetalle de la actualización sugerida:\n- \n\nFuente/referencia (si aplica):\n- \n\nGracias.`,
          },
          suggestion: {
            subject: `RadioCalc Clinical - Sugerencia${calcTitle ? ' (' + calcTitle + ')' : ''}`,
            body: `Hola Dr. Hevia,\n\nTengo una sugerencia sobre: ${page}.\n\nDetalle:\n- \n\nGracias.`,
          },
        },
        en: {
          bug: {
            subject: `RadioCalc Clinical - Bug report${calcTitle ? ' (' + calcTitle + ')' : ''}`,
            body: `Hi Dr. Hevia,\n\nI found a possible error in the calculator: ${page}.\n\nDescription of the issue:\n- \n\nInput values (if applicable):\n- \n\nExpected vs. obtained result:\n- \n\nThanks.`,
          },
          update: {
            subject: `RadioCalc Clinical - Update suggestion${calcTitle ? ' (' + calcTitle + ')' : ''}`,
            body: `Hi Dr. Hevia,\n\nI think the calculator "${page}" could be updated (new guideline, consensus version, newer reference, etc.).\n\nSuggested update details:\n- \n\nSource/reference (if applicable):\n- \n\nThanks.`,
          },
          suggestion: {
            subject: `RadioCalc Clinical - Suggestion${calcTitle ? ' (' + calcTitle + ')' : ''}`,
            body: `Hi Dr. Hevia,\n\nI have a suggestion about: ${page}.\n\nDetails:\n- \n\nThanks.`,
          },
        },
      };
      const tpl = templates[lang][type] || templates[lang].bug;
      return `mailto:${REPORT_EMAIL}?subject=${encodeURIComponent(tpl.subject)}&body=${encodeURIComponent(tpl.body)}`;
    };

    /* ============================================================
       ICONOS (inline SVG, estilo lucide)
    ============================================================ */
    const IconCopy = ({size=18}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>;
    const IconRefresh = ({size=18}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>;
    const IconAlertTriangle = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>;
    const IconCheckCircle = ({size=20}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>;
    const IconChevronLeft = ({className}) => <svg className={className || ""} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>;
    const IconChevronDown = ({className, size=18}) => <svg className={className || ""} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>;
    const IconMoon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg>;
    const IconSun = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>;
    const IconArrowRight = ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;
    const IconInfo = ({size=20, className}) => <svg className={className||""} xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>;
    const IconAlertCircle = IconInfo;
    const IconMail = ({size=18}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>;
    const IconLinkedin = ({size=18}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.07 2.07 0 1 1 0-4.13 2.07 2.07 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>;
    const IconBookOpen = ({size=16}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path></svg>;
    const IconStethoscope = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4.8 2.3A.3.3 0 1 0 5 2H4a2 2 0 0 0-2 2v5a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6V4a2 2 0 0 0-2-2h-1a.2.2 0 1 0 .3.3"></path><path d="M8 15v1a6 6 0 0 0 6 6v0a6 6 0 0 0 6-6v-4"></path><circle cx="20" cy="10" r="2"></circle></svg>;

    /* ============================================================
       LOGO
    ============================================================ */
    function Logo({ size = 40 }) {
      const id = React.useId ? React.useId() : 'logo';
      return (
        <svg width={size} height={size} viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" className="shrink-0">
          <defs>
            <linearGradient id={`grad-${id}`} x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stopColor="#2563eb" />
              <stop offset="1" stopColor="#06b6d4" />
            </linearGradient>
          </defs>
          <rect width="64" height="64" rx="16" fill={`url(#grad-${id})`} />
          <circle cx="32" cy="32" r="9" fill="none" stroke="white" strokeWidth="3" />
          <circle cx="32" cy="32" r="18" fill="none" stroke="white" strokeOpacity="0.55" strokeWidth="3" />
          <circle cx="32" cy="32" r="3.4" fill="white" />
        </svg>
      );
    }

    /* ============================================================
       COMPONENTES REUTILIZABLES
    ============================================================ */
    function Card({ children, className = '' }) {
      return (
        <div className={`bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-4 ${className}`}>
          {children}
        </div>
      );
    }

    // Acepta tanto punto como coma decimal (en TC número, Chrome ignora la coma
    // y el navegador rechaza el valor, dejando el campo vacío). Usamos type="text"
    // con teclado numérico (inputMode) y normalizamos coma -> punto internamente.
    function NumberField({ label, value, onChange, placeholder, small }) {
      const handleChange = (raw) => {
        const normalized = raw.replace(',', '.');
        if (normalized === '' || /^-?\d*\.?\d*$/.test(normalized)) {
          onChange(normalized);
        }
      };
      return (
        <div>
          {label && <label className="block text-xs text-slate-500 dark:text-slate-400 mb-1">{label}</label>}
          <input
            type="text"
            inputMode="decimal"
            placeholder={placeholder}
            value={value}
            onChange={e => handleChange(e.target.value)}
            className={`w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg ${small ? 'p-2.5 text-center' : 'p-3 text-lg'} focus:ring-2 focus:ring-blue-500 outline-none`}
          />
        </div>
      );
    }

    function CopyButton({ onClick, children }) {
      return (
        <button onClick={onClick} className="w-full flex items-center justify-center gap-2 bg-blue-50 dark:bg-blue-500/10 text-blue-600 dark:text-blue-400 py-3 rounded-xl font-medium hover:bg-blue-100 dark:hover:bg-blue-500/20 active:scale-95 transition-all">
          <IconCopy size={18} /> {children}
        </button>
      );
    }

    // Barra de resultado fija al final de la página (mismo patrón visual que TIRADS).
    // Uso: <StickyBar><div>...contenido del resultado...</div><div className="flex items-center gap-1.5 shrink-0"><ResetIconButton .../><CopyIconButton .../></div></StickyBar>
    function StickyBar({ children }) {
      return (
        <div className="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 p-4 shadow-lg z-40">
          <div className="max-w-md mx-auto flex items-center justify-between gap-3">
            {children}
          </div>
        </div>
      );
    }

    function ResetIconButton({ onClick, label }) {
      return (
        <button onClick={onClick} aria-label={label} title={label} className="p-3 bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300 rounded-full hover:bg-slate-200 dark:hover:bg-slate-600 active:scale-95 transition-all shrink-0">
          <IconRefresh size={20} />
        </button>
      );
    }

    function CopyIconButton({ onClick, disabled, label }) {
      return (
        <button onClick={onClick} disabled={disabled} aria-label={label} title={label} className={`p-3 rounded-full transition-all shrink-0 ${disabled ? 'bg-slate-100 text-slate-300 dark:bg-slate-700 dark:text-slate-600 cursor-not-allowed' : 'bg-blue-100 text-blue-600 dark:bg-blue-900 dark:text-blue-300 hover:bg-blue-200 dark:hover:bg-blue-800 active:scale-95'}`}>
          <IconCopy size={20} />
        </button>
      );
    }

    function InfoBox({ tone = 'amber', children }) {
      const tones = {
        amber: 'bg-amber-50 dark:bg-amber-500/10 text-amber-700 dark:text-amber-400',
        emerald: 'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-400',
      };
      return (
        <div className={`p-3 rounded-lg flex items-start gap-3 text-sm ${tones[tone]}`}>
          <IconAlertCircle size={20} className="shrink-0 mt-0.5" />
          <p>{children}</p>
        </div>
      );
    }

    // Acordeón genérico colapsable (usado por Referencias y por "Cómo se usa")
    function Accordion({ icon, title, children, defaultOpen = false }) {
      const [open, setOpen] = useState(defaultOpen);
      return (
        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 overflow-hidden">
          <button
            onClick={() => setOpen(!open)}
            className="w-full flex items-center justify-between px-5 py-3.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-50 dark:hover:bg-slate-700/40 transition-colors"
          >
            <span className="flex items-center gap-2">{icon} {title}</span>
            <IconChevronDown className={`transition-transform shrink-0 ${open ? 'rotate-180' : ''}`} />
          </button>
          {open && (
            <div className="refs-enter px-5 pb-4 border-t border-slate-100 dark:border-slate-700 pt-3">
              {children}
            </div>
          )}
        </div>
      );
    }

    // Sección de referencias bibliográficas, colapsable, al pie de cada calculadora
    function References({ items }) {
      const { t } = useLang();
      if (!items || items.length === 0) return null;
      return (
        <Accordion icon={<IconBookOpen size={16} />} title={t.common.references}>
          <ol className="space-y-2 text-xs text-slate-500 dark:text-slate-400 list-decimal list-inside">
            {items.map((ref, i) => <li key={i} className="leading-relaxed">{ref}</li>)}
          </ol>
        </Accordion>
      );
    }

    // Sección "Cómo se usa / puntos de corte", colapsable, al pie de cada calculadora
    function UsageNotes({ paragraphs }) {
      const { t } = useLang();
      if (!paragraphs || paragraphs.length === 0) return null;
      return (
        <Accordion icon={<IconInfo size={16} />} title={t.common.howToUse}>
          <div className="space-y-2 text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
            {paragraphs.map((p, i) => <p key={i}>{p}</p>)}
          </div>
        </Accordion>
      );
    }

    // Contenedor de esquema/ilustración original (SVG dibujado a mano, sin fotos ni capturas de terceros)
    function Schematic({ children, caption }) {
      return (
        <div className="bg-white dark:bg-slate-800 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 p-4 flex flex-col items-center gap-2">
          <div className="w-full max-w-xs text-slate-700 dark:text-slate-200">{children}</div>
          {caption && <p className="text-[11px] text-slate-400 dark:text-slate-500 text-center leading-snug">{caption}</p>}
        </div>
      );
    }

    /* ============================================================
       ESQUEMAS ORIGINALES (SVG dibujados a mano, línea simple)
       Todos son ilustraciones propias, no fotografías ni capturas
       de terceros, para evitar cualquier problema de derechos de autor.
    ============================================================ */
    const SVG_STROKE = { fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round' };

    function DiagProstate() {
      return (
        <svg viewBox="0 0 200 140" width="100%">
          <ellipse cx="100" cy="70" rx="55" ry="38" {...SVG_STROKE} />
          <line x1="100" y1="32" x2="100" y2="108" strokeDasharray="3 3" {...SVG_STROKE} />
          <line x1="45" y1="70" x2="155" y2="70" strokeDasharray="3 3" {...SVG_STROKE} />
          <text x="100" y="22" textAnchor="middle" fontSize="11" fill="currentColor">LONG</text>
          <text x="168" y="74" textAnchor="middle" fontSize="11" fill="currentColor">TR</text>
          <text x="100" y="128" textAnchor="middle" fontSize="11" fill="currentColor">AP</text>
          <line x1="100" y1="70" x2="100" y2="108" {...SVG_STROKE} strokeDasharray="0" />
        </svg>
      );
    }
    function DiagDixon() {
      return (
        <svg viewBox="0 0 200 120" width="100%">
          <rect x="20" y="30" width="70" height="60" rx="6" {...SVG_STROKE} />
          <text x="55" y="65" textAnchor="middle" fontSize="12" fill="currentColor">In-phase</text>
          <rect x="110" y="30" width="70" height="60" rx="6" {...SVG_STROKE} />
          <text x="145" y="60" textAnchor="middle" fontSize="12" fill="currentColor">Out-of-</text>
          <text x="145" y="74" textAnchor="middle" fontSize="12" fill="currentColor">phase</text>
          <line x1="90" y1="60" x2="108" y2="60" {...SVG_STROKE} markerEnd="url(#arrow)" />
          <path d="M100 55 L108 60 L100 65 Z" fill="currentColor" />
        </svg>
      );
    }
    function DiagWashoutCurve() {
      return (
        <svg viewBox="0 0 200 130" width="100%">
          <line x1="20" y1="110" x2="190" y2="110" {...SVG_STROKE} />
          <line x1="20" y1="110" x2="20" y2="15" {...SVG_STROKE} />
          <text x="4" y="18" fontSize="9" fill="currentColor">UH</text>
          <text x="170" y="124" fontSize="9" fill="currentColor">t</text>
          <path d="M20 95 L55 30 L100 55 L190 78" {...SVG_STROKE} stroke="#2563eb" />
          <circle cx="20" cy="95" r="3" fill="#2563eb" />
          <circle cx="55" cy="30" r="3" fill="#2563eb" />
          <circle cx="100" cy="55" r="3" fill="#2563eb" />
          <circle cx="190" cy="78" r="3" fill="#2563eb" />
          <text x="12" y="106" fontSize="8" fill="currentColor">sin CT</text>
          <text x="45" y="24" fontSize="8" fill="currentColor">portal</text>
          <text x="100" y="48" fontSize="8" fill="currentColor">5-10-15min</text>
        </svg>
      );
    }
    function DiagAdrenalCSI() {
      return (
        <svg viewBox="0 0 200 130" width="100%">
          <circle cx="60" cy="60" r="30" {...SVG_STROKE} />
          <text x="60" y="105" textAnchor="middle" fontSize="10" fill="currentColor">Lesión</text>
          <circle cx="150" cy="60" r="22" {...SVG_STROKE} strokeDasharray="4 3" />
          <text x="150" y="105" textAnchor="middle" fontSize="10" fill="currentColor">Bazo/hígado</text>
          <text x="60" y="35" textAnchor="middle" fontSize="9" fill="currentColor">↓ señal fuera de fase</text>
        </svg>
      );
    }
    function DiagLiverIron() {
      return (
        <svg viewBox="0 0 200 120" width="100%">

    /* ============================================================
       CALCULADORA: PSAD Y VOLUMEN PROSTÁTICO
    ============================================================ */
    function PSADCalculator() {
      const { t, lang } = useLang();
      const c = t.calc.psad;
      const [ap, setAp] = useState('');
      const [tr, setTr] = useState('');
      const [long, setLong] = useState('');
      const [psa, setPsa] = useState('');
      const [factor, setFactor] = useState(0.52);
      const vol = (parseFloat(ap) || 0) * (parseFloat(tr) || 0) * (parseFloat(long) || 0) * factor;
      const hasVolume = ap && tr && long && vol > 0;
      const psaVal = parseFloat(psa);
      const hasPsa = psa !== '' && !isNaN(psaVal);
      const psad = hasVolume && hasPsa ? psaVal / vol : 0;
      const showVolume = hasVolume;
      const showPsad = hasVolume && hasPsa;
      const isHighRisk = psad >= 0.15;

      const handleCopy = () => {
        const text = showPsad
          ? c.reportText(vol.toFixed(1), psa, psad.toFixed(2), isHighRisk ? c.highRisk : c.normal)
          : c.reportTextVolOnly(vol.toFixed(1));
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };
      const resetAll = () => { setAp(''); setTr(''); setLong(''); setPsa(''); setFactor(0.52); };

      return (
        <div className={`space-y-4 animate-in fade-in ${showVolume ? 'pb-24' : ''}`}>
          <Card>
            <div>
              <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">{c.dims}</label>
              <div className="grid grid-cols-3 gap-2">
                <NumberField small placeholder={c.ap} value={ap} onChange={setAp} />
                <NumberField small placeholder={c.tr} value={tr} onChange={setTr} />
                <NumberField small placeholder={c.long} value={long} onChange={setLong} />
              </div>
            </div>
            <NumberField label={c.psaLabel} placeholder={c.psaPh} value={psa} onChange={setPsa} />
            <div className="flex items-center justify-between mt-2 text-sm text-slate-500">
              <span>{c.formulaFactor}:</span>
              <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-lg">
                <button onClick={() => setFactor(0.52)} className={`px-3 py-1 rounded-md ${factor === 0.52 ? 'bg-white dark:bg-slate-700 shadow-sm font-medium text-slate-900 dark:text-white' : ''}`}>0.52</button>
                <button onClick={() => setFactor(0.523)} className={`px-3 py-1 rounded-md ${factor === 0.523 ? 'bg-white dark:bg-slate-700 shadow-sm font-medium text-slate-900 dark:text-white' : ''}`}>0.523</button>
              </div>
            </div>
          </Card>
          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.psad} />
          <ReportBugLink calcTitle={c.title} />
          {showVolume && (
            <StickyBar>
              <div className="min-w-0 text-left">
                <span className="text-xs text-slate-500 dark:text-slate-400 block">{c.volume}: <span className="font-semibold text-slate-700 dark:text-slate-200">{vol.toFixed(1)} cc</span></span>
                {showPsad ? (
                  <span className={`text-lg font-black flex items-center gap-1.5 ${isHighRisk ? 'text-red-500' : 'text-emerald-500'}`}>
                    {isHighRisk ? <IconAlertTriangle size={16} /> : <IconCheckCircle size={16} />}
                    {c.psad}: {psad.toFixed(2)}
                  </span>
                ) : (
                  <span className="text-xs text-slate-400 dark:text-slate-500">{c.psaPending}</span>
                )}
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <ResetIconButton onClick={resetAll} label={t.common.reset} />
                <CopyIconButton onClick={handleCopy} label={t.common.copyReport} />
              </div>
            </StickyBar>
          )}
        </div>
      );
    }

    /* ============================================================
       CALCULADORA: FRACCIÓN GRASA POR RM (DIXON)
    ============================================================ */
    function MRIFatFraction() {
      const { t, lang } = useLang();
      const c = t.calc.mriFf;
      const [method, setMethod] = useState('ff'); // 'ff' = single dual-echo; 'pct' = spleen-normalized
      const [inPhase, setInPhase] = useState('');
      const [outPhase, setOutPhase] = useState('');
      const [spleenIn, setSpleenIn] = useState('');
      const [spleenOut, setSpleenOut] = useState('');
      const sIn = parseFloat(inPhase);
      const sOut = parseFloat(outPhase);
      const spIn = parseFloat(spleenIn);
      const spOut = parseFloat(spleenOut);

      const isValidFf = !isNaN(sIn) && !isNaN(sOut) && sIn !== 0;
      const ff = isValidFf ? ((sIn - sOut) / (2 * sIn)) * 100 : 0;

      const ratioIn = sIn / spIn;
      const ratioOut = sOut / spOut;
      const isValidPct = !isNaN(sIn) && !isNaN(sOut) && !isNaN(spIn) && !isNaN(spOut) && spIn !== 0 && spOut !== 0 && ratioIn !== 0;
      const fp = isValidPct ? ((ratioIn - ratioOut) / (2 * ratioIn)) * 100 : 0;

      const isValid = method === 'ff' ? isValidFf : isValidPct;
      const value = method === 'ff' ? ff : fp;
      const hasAnyInput = method === 'ff'
        ? (inPhase !== '' || outPhase !== '')
        : (inPhase !== '' || outPhase !== '' || spleenIn !== '' || spleenOut !== '');

      const handleCopy = () => {
        const text = method === 'ff'
          ? c.reportText(ff.toFixed(1), inPhase, outPhase)
          : c.reportTextPct(fp.toFixed(1), inPhase, outPhase, spleenIn, spleenOut);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };
      const resetAll = () => { setMethod('ff'); setInPhase(''); setOutPhase(''); setSpleenIn(''); setSpleenOut(''); };

      return (
        <div className={`space-y-4 animate-in fade-in ${hasAnyInput ? 'pb-24' : ''}`}>
          <Card>
            <label className="block text-xs text-slate-500 dark:text-slate-400 mb-2">{c.methodLabel}</label>
            <div className="space-y-2">
              <button
                onClick={() => setMethod('ff')}
                className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${method === 'ff' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}
              >
                {c.methodFf}
              </button>
              <button
                onClick={() => setMethod('pct')}
                className={`w-full text-left p-2.5 rounded-lg border text-xs transition-all ${method === 'pct' ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}
              >
                {c.methodPct}
              </button>
            </div>
          </Card>
          <Card>
            <NumberField label={c.inPhase} placeholder={c.inPh} value={inPhase} onChange={setInPhase} />
            <div className="mt-3">
              <NumberField label={c.outPhase} placeholder={c.outPh} value={outPhase} onChange={setOutPhase} />
            </div>
            {method === 'pct' && (
              <>
                <div className="mt-3">
                  <NumberField label={c.spleenInPhase} placeholder={c.spleenInPh} value={spleenIn} onChange={setSpleenIn} />
                </div>
                <div className="mt-3">
                  <NumberField label={c.spleenOutPhase} placeholder={c.spleenOutPh} value={spleenOut} onChange={setSpleenOut} />
                </div>
              </>
            )}
          </Card>
          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.mriFf} />
          <ReportBugLink calcTitle={c.title} />
          {hasAnyInput && (
            <StickyBar>
              <div className="min-w-0 text-left">
                <span className="text-xs text-slate-500 dark:text-slate-400 block">{method === 'ff' ? c.estimated : c.estimatedPct}</span>
                <span className="text-xl font-black text-blue-600 dark:text-blue-400">{isValid ? value.toFixed(1) + '%' : '—'}</span>
                {!isValid && <span className="text-xs text-slate-400 ml-2">{t.common.notEvaluated}</span>}
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <ResetIconButton onClick={resetAll} label={t.common.reset} />
                <CopyIconButton onClick={handleCopy} disabled={!isValid} label={t.common.copyReport} />
              </div>
            </StickyBar>
          )}
        </div>
      );
    }

      p15: { minutes: 15, apwCut: 60, rpwCut: 40 },

      p5: { minutes: 5 },
    };

    function AdrenalWashout() {
      const { t, lang } = useLang();
      const c = t.calc.adrenalCt;
      const [protocol, setProtocol] = useState('p15');
      const [nc, setNc] = useState('');
      const [ven, setVen] = useState('');
      const [del, setDel] = useState('');
      const hNc = parseFloat(nc);
      const hVen = parseFloat(ven);
      const hDel = parseFloat(del);
      const hasAnyInput = nc !== '' || ven !== '' || del !== '';
      const isValid = !isNaN(hNc) && !isNaN(hVen) && !isNaN(hDel);
      const cfg = ADRENAL_PROTOCOLS[protocol];

      // Protocolos 15 y 10 min: APW/RPW clásicos con distinto punto de corte
      const apw = isValid ? ((hVen - hDel) / (hVen - hNc)) * 100 : 0;
      const rpw = isValid ? ((hVen - hDel) / hVen) * 100 : 0;
      const isAdenomaAPW = protocol !== 'p5' && isValid && apw >= cfg.apwCut;
      const isAdenomaRPW = protocol !== 'p5' && isValid && rpw >= cfg.rpwCut;
      const isAdenomaClassic = isAdenomaAPW || isAdenomaRPW;

      // Protocolo 5 min (Kamiyama 2009): 4 criterios combinados, cualquiera basta
      const pew = isValid ? ((hVen - hDel) / hVen) * 100 : 0;
      const rpew = isValid ? ((hVen - hDel) / (hVen - hNc)) * 100 : 0;
      const crit5 = {
        nc: isValid && hNc <= 19,
        delayed: isValid && hDel <= 50,
        pew: isValid && pew >= 45,
        rpew: isValid && rpew >= 31,
      };
      const isAdenoma5min = isValid && (crit5.nc || crit5.delayed || crit5.pew || crit5.rpew);
      const isAdenoma = protocol === 'p5' ? isAdenoma5min : isAdenomaClassic;

      const protocolLabel = protocol === 'p15' ? c.protocol15 : protocol === 'p10' ? c.protocol10 : c.protocol5;

      const handleCopy = () => {
        let text;
        if (protocol === 'p5') {
          const met = Object.entries(crit5).filter(([,v]) => v).length;
          text = c.reportText5min(nc, ven, del, met, isAdenoma5min ? c.compatible : c.notSuggestive);
        } else {
          text = c.reportText(protocolLabel, nc, ven, del, apw.toFixed(1), isAdenomaAPW ? c.compatible : c.notSuggestive, rpw.toFixed(1), isAdenomaRPW ? c.compatible : c.notSuggestive);
        }
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };
      const resetAll = () => { setProtocol('p15'); setNc(''); setVen(''); setDel(''); };

      return (
        <div className={`space-y-4 animate-in fade-in ${isValid ? 'pb-24' : ''}`}>
          <Card>
            <div>
              <label className="block text-xs text-slate-500 dark:text-slate-400 mb-1">{c.protocol}</label>
              <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-xl">
                {['p15','p10','p5'].map(p => (
                  <button key={p} onClick={() => setProtocol(p)} className={`flex-1 py-2 text-xs sm:text-sm font-medium rounded-lg transition-all ${protocol === p ? 'bg-white dark:bg-slate-800 shadow-sm text-blue-600 dark:text-blue-400' : 'text-slate-500 hover:text-slate-700 dark:hover:text-slate-300'}`}>
                    {p === 'p15' ? c.protocol15 : p === 'p10' ? c.protocol10 : c.protocol5}
                  </button>
                ))}
              </div>
            </div>
            <NumberField label={c.nonContrast} value={nc} onChange={setNc} />
            <NumberField label={c.portal} value={ven} onChange={setVen} />
            <NumberField label={c.delayedAt(cfg.minutes)} value={del} onChange={setDel} />
            <p className="text-[11px] text-slate-400 dark:text-slate-500 leading-snug">{c.roiTip}</p>
          </Card>

          {!isNaN(hNc) && (
            <Card>
              <p className="text-xs font-medium text-slate-500 dark:text-slate-400 mb-1">{c.ncOnlyTitle}</p>
              <div className="space-y-2 text-sm">
                {hNc <= 10 && (
                  <InfoBox tone="emerald">{c.ncHighSpec}</InfoBox>
                )}
                {hNc > 10 && hNc < 18 && (
                  <InfoBox tone="amber">{c.ncSuggestive}</InfoBox>
                )}
                {hNc >= 18 && (
                  <InfoBox tone="amber">{c.ncNonDiagnostic}</InfoBox>
                )}
                {hNc <= -30 && (
                  <InfoBox tone="amber">{c.myelolipoma}</InfoBox>
                )}
              </div>
            </Card>
          )}

          {!isNaN(hVen) && hVen > 100 && (isNaN(hNc) || hNc >= 10) && (
            <InfoBox tone="amber">{c.pheoCaution}</InfoBox>
          )}

          {hasAnyInput && protocol !== 'p5' && (
            <Card>
              <div className="grid grid-cols-2 gap-4">
                <div className="text-center p-3 bg-slate-50 dark:bg-slate-900 rounded-xl">
                  <span className="block text-xs text-slate-500 dark:text-slate-400 mb-1">{c.absolute}</span>
                  <span className={`text-xl font-bold ${isAdenomaAPW ? 'text-emerald-500' : 'text-slate-700 dark:text-slate-200'}`}>
                    {isValid ? apw.toFixed(1) + '%' : '—'}
                  </span>
                  <span className="block text-[10px] text-slate-400 mt-1">{t.common.cutoff} &ge; {cfg.apwCut}%</span>
                </div>
                <div className="text-center p-3 bg-slate-50 dark:bg-slate-900 rounded-xl">
                  <span className="block text-xs text-slate-500 dark:text-slate-400 mb-1">{c.relative}</span>
                  <span className={`text-xl font-bold ${isAdenomaRPW ? 'text-emerald-500' : 'text-slate-700 dark:text-slate-200'}`}>
                    {isValid ? rpw.toFixed(1) + '%' : '—'}
                  </span>
                  <span className="block text-[10px] text-slate-400 mt-1">{t.common.cutoff} &ge; {cfg.rpwCut}%</span>
                </div>
              </div>
              {isValid && (
                <InfoBox tone={isAdenoma ? 'emerald' : 'amber'}>

          )}

          {hasAnyInput && protocol === 'p5' && (
            <Card>
              <p className="text-xs font-medium text-slate-500 dark:text-slate-400">{c.fiveMinTitle}</p>
              <ul className="space-y-1.5 text-sm">
                <li className={`flex items-center gap-2 ${crit5.nc ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500'}`}>{crit5.nc ? <IconCheckCircle size={16} /> : <span className="w-4" />} {c.fiveMinNc}</li>
                <li className={`flex items-center gap-2 ${crit5.delayed ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500'}`}>{crit5.delayed ? <IconCheckCircle size={16} /> : <span className="w-4" />} {c.fiveMinDelayed}</li>
                <li className={`flex items-center gap-2 ${crit5.pew ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500'}`}>{crit5.pew ? <IconCheckCircle size={16} /> : <span className="w-4" />} {c.fiveMinPew} {isValid && `(${pew.toFixed(1)}%)`}</li>
                <li className={`flex items-center gap-2 ${crit5.rpew ? 'text-emerald-600 dark:text-emerald-400' : 'text-slate-500'}`}>{crit5.rpew ? <IconCheckCircle size={16} /> : <span className="w-4" />} {c.fiveMinRpew} {isValid && `(${rpew.toFixed(1)}%)`}</li>
              </ul>
              {isValid && (
                <InfoBox tone={isAdenoma5min ? 'emerald' : 'amber'}>
                  {isAdenoma5min ? c.adenomaCompatible : c.adenomaNot}
                </InfoBox>

            </Card>

          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.adrenalCt} />
          <ReportBugLink calcTitle={c.title} />
          {isValid && (
            <StickyBar>
              <div className="min-w-0 text-left">
                <span className="text-xs text-slate-500 dark:text-slate-400 block">{protocolLabel}</span>
                <span className={`text-lg font-black ${isAdenoma ? 'text-emerald-500' : 'text-amber-500'}`}>{isAdenoma ? c.adenomaCompatible : c.adenomaNot}</span>

    /* ============================================================

    function AdrenalCSI() {
      const { t, lang } = useLang();
      const c = t.calc.adrenalMri;

      const rIn = parseFloat(refIn);

      const isValid = !isNaN(lIn) && !isNaN(lOut) && !isNaN(rIn) && !isNaN(rOut) && lIn !== 0 && rOut !== 0 && rIn !== 0;
      const ratioIn = isValid ? (lIn / rIn) : 0;
      const ratioOut = isValid ? (lOut / rOut) : 0;
      const csi = isValid ? (ratioOut / ratioIn) * 100 : 0;
      const isAdenoma = csi < 71;

      const handleCopy = () => {
        const text = c.reportText(lesionIn, lesionOut, refIn, refOut, csi.toFixed(1), isAdenoma ? c.conclAdenoma : c.conclNot);

    /* ============================================================
       CALCULADORA: SIDEROSIS HEPÁTICA POR RM
    ============================================================ */
    function HepaticSiderosis() {
      const { t, lang } = useLang();
      const c = t.calc.siderosis;
      const [inputType, setInputType] = useState('t2star');
      const [val, setVal] = useState('');
      const numericVal = parseFloat(val);
      const isValid = !isNaN(numericVal) && numericVal > 0;
      let r2star = 0, t2star = 0;
      if (isValid) {
        if (inputType === 't2star') { t2star = numericVal; r2star = 1000 / t2star; }
        else { r2star = numericVal; t2star = 1000 / r2star; }
      }
      const lic = isValid ? (0.0254 * r2star) + 0.202 : 0;
      let category = '', color = '';
      if (isValid) {
        if (lic < 1.8) { category = c.catNormal; color = 'text-emerald-500'; }
        else if (lic <= 7.0) { category = c.catMild; color = 'text-amber-500'; }
        else if (lic <= 15.0) { category = c.catModerate; color = 'text-orange-500'; }
        else { category = c.catSevere; color = 'text-red-500'; }
      }

      const handleCopy = () => {
        const text = c.reportText(t2star.toFixed(2), r2star.toFixed(2), lic.toFixed(2), category);
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };
      const resetAll = () => { setInputType('t2star'); setVal(''); };

      return (
        <div className={`space-y-4 animate-in fade-in ${isValid ? 'pb-24' : ''}`}>
          <InfoBox tone="amber">{c.fieldStrengthNote}</InfoBox>
          <Card>
            <div className="flex bg-slate-100 dark:bg-slate-900 p-1 rounded-xl mb-1">

              >
                {c.enterR2}
              </button>
            </div>
            <NumberField
              label={`${c.valueOf} ${inputType === 't2star' ? 'T2*' : 'R2*'}`}
              placeholder={inputType === 't2star' ? 'Ej: 12.5' : 'Ej: 80'}
              value={val}
              onChange={setVal}

          </Card>
          {isValid && (
            <Card>
              <div className="grid grid-cols-2 gap-4 pb-4 border-b border-slate-100 dark:border-slate-700">
                <div>
                  <span className="block text-xs text-slate-500">T2*</span>
                  <span className="text-lg font-bold">{t2star.toFixed(2)} ms</span>
                </div>
                <div>
                  <span className="block text-xs text-slate-500">R2*</span>
                  <span className="text-lg font-bold">{r2star.toFixed(2)} Hz</span>
                </div>
              </div>
              <div className="flex flex-col items-center justify-center py-2">
                <span className="text-sm text-slate-500 dark:text-slate-400 mb-1">{c.licEstimated}</span>
                <span className={`text-4xl font-bold ${color}`}>{lic.toFixed(2)}</span>
                <span className={`mt-2 font-medium px-3 py-1 rounded-full text-sm ${color.replace('text', 'bg').replace('500', '50 dark:bg-opacity-20')} ${color}`}>
                  {category}
                </span>
              </div>
            </Card>
          )}
          <UsageNotes paragraphs={c.usage} />
          <References items={REFERENCES.siderosis} />
          <ReportBugLink calcTitle={c.title} />
          {isValid && (
            <StickyBar>
              <div className="min-w-0 text-left">
                <span className="text-xs text-slate-500 dark:text-slate-400 block">{c.licEstimated}: <span className={`font-black ${color}`}>{lic.toFixed(2)}</span></span>
                <span className={`text-sm font-semibold ${color}`}>{category}</span>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <ResetIconButton onClick={resetAll} label={t.common.reset} />
                <CopyIconButton onClick={handleCopy} label={t.common.copyReport} />

            </StickyBar>
          )}

    /* ============================================================
       CALCULADORA: GRASA TÍMICA / HIPERPLASIA

    function ThymicFat() {

    /* ============================================================
       CALCULADORA: ACR TI-RADS (TIROIDES)
    ============================================================ */
    const TIRADS_POINTS = {
      composition: [0, 0, 1, 2],
      echogenicity: [0, 1, 2, 3],
      shape: [0, 3],
      margin: [0, 0, 2, 3],
      echogenicFoci: [0, 1, 2, 3],
    };

    function TIRADS() {
      const { t, lang } = useLang();
      const c = t.calc.tirads;
      const [selections, setSelections] = useState({
        composition: null, echogenicity: null, shape: null, margin: null, echogenicFoci: [],
      });

      const toggleSelection = (category, index, multi = false) => {
        setSelections(prev => {
          if (multi) {
            const current = prev[category];
            return {
              ...prev,
              [category]: current.includes(index) ? current.filter(i => i !== index) : [...current, index],
            };
          }
          return { ...prev, [category]: index };
        });
      };

      const calculatePoints = () => {
        let pts = 0;
        ['composition', 'echogenicity', 'shape', 'margin'].forEach(cat => {
          if (selections[cat] !== null) pts += TIRADS_POINTS[cat][selections[cat]];
        });
        selections.echogenicFoci.forEach(i => { pts += TIRADS_POINTS.echogenicFoci[i]; });
        return pts;
      };
      const pts = calculatePoints();

      let catKey = '', color = '';
      if (pts === 0) { catKey = 'TR1'; color = 'text-emerald-500'; }
      else if (pts <= 2) { catKey = 'TR2'; color = 'text-emerald-500'; }
      else if (pts === 3) { catKey = 'TR3'; color = 'text-amber-500'; }
      else if (pts <= 6) { catKey = 'TR4'; color = 'text-orange-500'; }
      else { catKey = 'TR5'; color = 'text-red-500'; }
      const catInfo = c.categories[catKey];

      const handleCopy = () => {
        const critEs = c.criteria;
        const label = (cat) => selections[cat] !== null ? critEs[cat].options[selections[cat]] : t.common.notEvaluated;
        const foci = selections.echogenicFoci.length
          ? selections.echogenicFoci.map(i => critEs.echogenicFoci.options[i]).join(', ')
          : t.common.none;
        const text = c.reportText(
          label('composition'), label('echogenicity'), label('shape'), label('margin'), foci,
          pts, catKey, catInfo.risk, catInfo.recs
        );
        copyToClipboard(text, t.common.copiedOk, t.common.copiedErr);
      };
      const resetAll = () => {
        setSelections({ composition: null, echogenicity: null, shape: null, margin: null, echogenicFoci: [] });
      };

      return (
        <div className="space-y-4 pb-28">
          {Object.entries(c.criteria).map(([key, data]) => (
            <div key={key} className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">

    /* ============================================================
       CALCULADORA: LI-RADS v2018 (TC/RM DE HÍGADO)
    ============================================================ */
    function computeLiRads(size, aphe, feats) {
      // size: 1 (<10mm) | 2 (10-19mm) | 3 (>=20mm)
      const featCount = Object.values(feats).filter(Boolean).length;
      if (!aphe) {
        if (size === 3) return featCount >= 1 ? 'LR-4' : 'LR-3';
        return featCount >= 2 ? 'LR-4' : 'LR-3';
      }
      // APHE presente
      if (size === 1) return featCount >= 1 ? 'LR-4' : 'LR-3';
      if (size === 2) {
        // Celda diagonal de la tabla oficial CT/MRI LI-RADS v2018 CORE (10-19 mm + APHE):
        // 0 características = LR-3; con exactamente 1 característica, la cápsula realzante
        // por sí sola solo alcanza LR-4, mientras que el lavado no periférico o el crecimiento
        // umbral por sí solos ya son LR-5; ≥2 características = LR-5.
        if (featCount === 0) return 'LR-3';
        if (featCount === 1) return feats.capsule ? 'LR-4' : 'LR-5';
        return 'LR-5';
      }
      return featCount >= 1 ? 'LR-5' : 'LR-4';
    }

    // Paso 2 (opcional) de LI-RADS v2018: ajuste por características auxiliares (AF).
    // ≥1 AF a favor de malignidad sube 1 nivel, con tope en LR-4 (las AF nunca alcanzan LR-5
    // por sí solas). ≥1 AF a favor de benignidad baja 1 nivel. Si hay de ambos tipos a la vez,
    // no se ajusta. Solo aplica a categorías numéricas (LR-1 a LR-5), nunca a LR-TIV/LR-M.
    function adjustLiRadsForAF(baseCat, hasMalignantAF, hasBenignAF) {
      const order = ['LR-1', 'LR-2', 'LR-3', 'LR-4', 'LR-5'];
      const idx = order.indexOf(baseCat);
      if (idx === -1) return baseCat;
      if (hasMalignantAF && hasBenignAF) return baseCat;
      if (hasMalignantAF) {
        if (baseCat === 'LR-5') return baseCat;
        const capIdx = order.indexOf('LR-4');
        return order[Math.min(idx + 1, capIdx)];
      }
      if (hasBenignAF) return order[Math.max(idx - 1, 0)];
      return baseCat;
    }

    function LIRADS() {
      const { t, lang } = useLang();
      const c = t.calc.lirads;
      const [size, setSize] = useState(0);
      const [aphe, setAphe] = useState(null);
      const [feats, setFeats] = useState({ washout: false, capsule: false, growth: false });
      const [lrM, setLrM] = useState(null);
      const [lrTiv, setLrTiv] = useState(null);
      const [lrTivCont, setLrTivCont] = useState('');
      const [afMalignant, setAfMalignant] = useState({});
      const [afBenignSel, setAfBenignSel] = useState({});

      const hasBasics = size > 0 && aphe !== null;
      const baseCat = hasBasics ? computeLiRads(size, aphe, feats) : null;
      // El Paso 2 (características auxiliares) solo aplica a la vía numérica (LR-1 a LR-5),
      // nunca cuando la categoría final ya quedó fijada por LR-TIV o LR-M.
      const showAfStep = hasBasics && lrTiv === false && lrM === false;
      const hasMalignantAF = showAfStep && Object.values(afMalignant).some(Boolean);
      const hasBenignAF = showAfStep && Object.values(afBenignSel).some(Boolean);
      const adjustedCat = showAfStep ? adjustLiRadsForAF(baseCat, hasMalignantAF, hasBenignAF) : baseCat;
      const finalCat = lrTiv ? 'LR-TIV' : (lrM ? 'LR-M' : adjustedCat);
      const afApplied = hasMalignantAF || hasBenignAF;
      const afNote = !afApplied ? null
        : (hasMalignantAF && hasBenignAF) ? c.afConflictNote
        : hasMalignantAF ? (adjustedCat !== baseCat ? c.afUpgradedTo(baseCat, adjustedCat) : c.afCappedNote(baseCat))
        : (adjustedCat !== baseCat ? c.afDowngradedTo(baseCat, adjustedCat) : null);

      const toggleFeat = (key) => setFeats(prev => ({ ...prev, [key]: !prev[key] }));
      const toggleAfMal = (key) => setAfMalignant(prev => ({ ...prev, [key]: !prev[key] }));
      const toggleAfBen = (key) => setAfBenignSel(prev => ({ ...prev, [key]: !prev[key] }));

      const handleCopy = () => {
        if (!finalCat) return;
        const sizeLabel = size === 1 ? c.size1 : size === 2 ? c.size2 : c.size3;
        const featLabels = Object.entries(feats).filter(([,v]) => v).map(([k]) => k === 'washout' ? c.featWashout : k === 'capsule' ? c.featCapsule : c.featGrowth);
        const override = lrTiv ? c.lrTiv : (lrM ? c.lrM : '');
        const contPhrase = (lrTiv && lrTivCont) ? c.lrTivContinuity[lrTivCont] : '';
        const catLabel = `${finalCat} — ${c.categories[finalCat]}` + (contPhrase ? ', ' + contPhrase.charAt(0).toLowerCase() + contPhrase.slice(1) : '');
        let afSummary = '';
        if (afApplied) {
          const malLabels = [
            ...c.afMalignantGeneral.map((l, i) => ({ l, k: 'g' + i })),
            ...c.afMalignantHcc.map((l, i) => ({ l, k: 'h' + i })),
          ].filter(x => afMalignant[x.k]).map(x => x.l);
          const benLabels = c.afBenign.map((l, i) => ({ l, k: 'b' + i })).filter(x => afBenignSel[x.k]).map(x => x.l);
          afSummary = c.afSummaryText(baseCat, malLabels.length ? malLabels.join(', ') : t.common.none, benLabels.length ? benLabels.join(', ') : t.common.none);

        const text = c.reportText(sizeLabel, aphe ? t.common.yes : t.common.no, featLabels.length ? featLabels.join(', ') : t.common.none, override, catLabel, afSummary);

              <button onClick={() => setLrTiv(false)} className={`flex-1 py-2 rounded-lg font-medium border ${lrTiv === false ? 'bg-slate-600 border-slate-600 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{t.common.no}</button>

          {lrTiv === true && (

                  <button key={key} onClick={() => setLrTivCont(key)} className={`w-full text-left p-2.5 rounded-lg border text-sm transition-all ${lrTivCont === key ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{label}</button>
                ))}

          {lrTiv === false && (
            <Card>
              <InfoBox tone="amber">{c.lrM}</InfoBox>
              <div className="flex gap-2">
                <button onClick={() => setLrM(true)} className={`flex-1 py-2 rounded-lg font-medium border ${lrM === true ? 'bg-red-600 border-red-600 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{t.common.yes}</button>
                <button onClick={() => setLrM(false)} className={`flex-1 py-2 rounded-lg font-medium border ${lrM === false ? 'bg-slate-600 border-slate-600 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{t.common.no}</button>
              </div>

          )}
          {lrTiv === false && lrM === false && (
            <Card className="space-y-5">
              <div>
                <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.sizeLabel}</label>
                <div className="flex gap-2">
                  {[[1,c.size1],[2,c.size2],[3,c.size3]].map(([val,label]) => (
                    <button key={val} onClick={() => setSize(val)} className={`flex-1 py-2 text-sm rounded-lg font-medium border ${size === val ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{label}</button>
                  ))}
                </div>
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.apheLabel}</label>
                <div className="flex gap-2">
                  <button onClick={() => setAphe(true)} className={`flex-1 py-2 rounded-lg font-medium border ${aphe === true ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{t.common.yes}</button>
                  <button onClick={() => setAphe(false)} className={`flex-1 py-2 rounded-lg font-medium border ${aphe === false ? 'bg-blue-600 border-blue-600 text-white' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>{t.common.no}</button>
                </div>
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.featuresLabel}</label>
                <div className="space-y-2">
                  {[['washout', c.featWashout],['capsule', c.featCapsule],['growth', c.featGrowth]].map(([key, label]) => (
                    <button key={key} onClick={() => toggleFeat(key)} className={`w-full text-left p-3 rounded-xl border text-sm transition-all flex items-center gap-2 ${feats[key] ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>
                      {feats[key] ? <IconCheckCircle size={16} /> : <span className="w-4" />} {label}
                    </button>
                  ))}
                </div>
              </div>
            </Card>
          )}
          {showAfStep && (
            <Card className="space-y-4">
              <div>
                <h3 className="font-semibold text-slate-800 dark:text-slate-200 text-sm">{c.afSectionTitle}</h3>
                <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 leading-snug">{c.afIntro}</p>
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.afMalignantGeneralTitle}</label>
                <div className="space-y-2">
                  {c.afMalignantGeneral.map((label, i) => {
                    const key = 'g' + i;
                    return (
                      <button key={key} onClick={() => toggleAfMal(key)} className={`w-full text-left p-3 rounded-xl border text-sm transition-all flex items-center gap-2 ${afMalignant[key] ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>
                        {afMalignant[key] ? <IconCheckCircle size={16} /> : <span className="w-4" />} {label}
                      </button>
                    );
                  })}
                </div>
              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.afMalignantHccTitle}</label>
                <div className="space-y-2">
                  {c.afMalignantHcc.map((label, i) => {
                    const key = 'h' + i;
                    return (
                      <button key={key} onClick={() => toggleAfMal(key)} className={`w-full text-left p-3 rounded-xl border text-sm transition-all flex items-center gap-2 ${afMalignant[key] ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>
                        {afMalignant[key] ? <IconCheckCircle size={16} /> : <span className="w-4" />} {label}
                      </button>

              </div>
              <div>
                <label className="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">{c.afBenignTitle}</label>
                <div className="space-y-2">
                  {c.afBenign.map((label, i) => {
                    const key = 'b' + i;
                    return (
                      <button key={key} onClick={() => toggleAfBen(key)} className={`w-full text-left p-3 rounded-xl border text-sm transition-all flex items-center gap-2 ${afBenignSel[key] ? 'border-emerald-500 bg-emerald-50 dark:bg-emerald-500/10 text-emerald-700 dark:text-emerald-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400'}`}>

          {finalCat && lrTiv && lrTivCont && (
            <InfoBox tone={lrTivCont === 'unspecified' ? 'amber' : 'emerald'}>{c.lrTivContinuity[lrTivCont]}</InfoBox>

          {finalCat && afNote && (
            <InfoBox tone="amber">{afNote}</InfoBox>
          )}

            <StickyBar>
              <div className="min-w-0 text-left">
                <span className={`text-xl font-black ${finalCat === 'LR-5' || finalCat === 'LR-M' || finalCat === 'LR-TIV' ? 'text-red-500' : finalCat === 'LR-4' ? 'text-orange-500' : finalCat === 'LR-3' ? 'text-amber-500' : 'text-emerald-500'}`}>{finalCat}</span>
                <p className="text-xs text-slate-600 dark:text-slate-300 leading-snug">{c.categories[finalCat]}</p>
              </div>
              <div className="flex items-center gap-1.5 shrink-0">
                <ResetIconButton onClick={resetAll} label={t.common.reset} />
