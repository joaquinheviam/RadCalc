function PSADCalculator() {
  const [ap, setAp] = useState('');
  const [tr, setTr] = useState('');
  const [long, setLong] = useState('');
  const [psa, setPsa] = useState('');
  const [factor, setFactor] = useState(0.52);

  const vol = (parseFloat(ap) || 0) * (parseFloat(tr) || 0) * (parseFloat(long) || 0) * factor;
  const psad = (parseFloat(psa) || 0) / (vol || 1);
  const showResults = ap && tr && long && psa;
  const isHighRisk = psad >= 0.15;

  const handleCopy = () => {
    const text = `Volumen prostÃ¡tico: ${vol.toFixed(1)} cc.
PSA Total: ${psa} ng/mL.
Densidad de PSA (PSAD): ${psad.toFixed(2)} ng/mL/cc (${isHighRisk ? 'Elevado' : 'Normal'}).`;
    copyToClipboard(text);
  };

  return (
    <div className="space-y-4 animate-in fade-in">
      <div className="bg-white dark:bg-slate-800 p-5 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700 space-y-4">

            <input type="number" placeholder="TR" value={tr} onChange={e => setTr(e.target.value)} className="w-full bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg p-2.5 text-center focus:ring-2 focus:ring-blue-500 outline-none" />

function MRIFatFraction() {
  const [inPhase, setInPhase] = useState('');
  const [outPhase, setOutPhase] = useState('');

  const sIn = parseFloat(inPhase);
  const sOut = parseFloat(outPhase);
  const isValid = !isNaN(sIn) && !isNaN(sOut) && sIn !== 0;
  
  // (In - Out) / (2 * In) * 100 for standard phase-inversion fat fraction
  const ff = isValid ? ((sIn - sOut) / (2 * sIn)) * 100 : 0;

  const handleCopy = () => {
    const text = `FracciÃ³n Grasa por RM (Dixon/Phase-Inversion): ${ff.toFixed(1)}%. (In-phase: ${inPhase}, Out-phase: ${outPhase}).`;
    copyToClipboard(text);

function AdrenalWashout() {

function HepaticSiderosis() {
  const [inputType, setInputType] = useState('t2star');
  const [val, setVal] = useState('');

  const numericVal = parseFloat(val);
  const isValid = !isNaN(numericVal) && numericVal > 0;

  let r2star = 0;
  let t2star = 0;

  if (isValid) {
    if (inputType === 't2star') {
      t2star = numericVal;
      r2star = 1000 / t2star;
    } else {
      r2star = numericVal;
      t2star = 1000 / r2star;
    }
  }

  // LIC (mg/g) = 0.0254 * R2* + 0.202
  const lic = isValid ? (0.0254 * r2star) + 0.202 : 0;

  let category = '';
  let color = '';
  if (isValid) {
    if (lic < 1.8) {
      category = 'Normal';
      color = 'text-emerald-500';
    } else if (lic <= 7.0) {
      category = 'Sobrecarga Leve';

function TIRADS() {
  const [selections, setSelections] = useState({
    composition: null,
    echogenicity: null,
    shape: null,
    margin: null,
    echogenicFoci: []
  });

  const toggleSelection = (category, index, multi = false) => {
    if (multi) {
      const current = selections[category];
      if (current.includes(index)) {
        setSelections({ ...selections, [category]: current.filter(i => i !== index) });
      } else {
        setSelections({ ...selections, [category]: [...current, index] });
      }
    } else {
      setSelections({ ...selections, [category]: index });
    }
  };

  const calculatePoints = () => {
    let pts = 0;
    if (selections.composition !== null) pts += TIRADS_CRITERIA.composition.options[selections.composition].points;
    if (selections.echogenicity !== null) pts += TIRADS_CRITERIA.echogenicity.options[selections.echogenicity].points;
    if (selections.shape !== null) pts += TIRADS_CRITERIA.shape.options[selections.shape].points;
    if (selections.margin !== null) pts += TIRADS_CRITERIA.margin.options[selections.margin].points;
    
    selections.echogenicFoci.forEach(i => {
      pts += TIRADS_CRITERIA.echogenicFoci.options[i].points;
    });
    return pts;
  };

  const pts = calculatePoints();
  
  let category = '';
  let risk = '';
  let recs = '';
  let color = '';

  if (pts === 0) { category = 'TR1'; risk = 'Benigno'; recs = 'No FNA'; color = 'text-emerald-500'; }
  else if (pts <= 2) { category = 'TR2'; risk = 'No sospechoso'; recs = 'No FNA'; color = 'text-emerald-500'; }
  else if (pts === 3) { category = 'TR3'; risk = 'Levemente sospechoso'; recs = 'FNA si â‰¥ 2.5 cm. Seguir si â‰¥ 1.5 cm'; color = 'text-amber-500'; }
  else if (pts <= 6) { category = 'TR4'; risk = 'Moderadamente sospechoso'; recs = 'FNA si â‰¥ 1.5 cm. Seguir si â‰¥ 1.0 cm'; color = 'text-orange-500'; }
  else { category = 'TR5'; risk = 'Altamente sospechoso'; recs = 'FNA si â‰¥ 1.0 cm. Seguir si â‰¥ 0.5 cm'; color = 'text-red-500'; }

  const handleCopy = () => {
    const c = selections.composition !== null ? TIRADS_CRITERIA.composition.options[selections.composition].label : 'No evaluado';
    const e = selections.echogenicity !== null ? TIRADS_CRITERIA.echogenicity.options[selections.echogenicity].label : 'No evaluado';
    const s = selections.shape !== null ? TIRADS_CRITERIA.shape.options[selections.shape].label : 'No evaluado';
    const m = selections.margin !== null ? TIRADS_CRITERIA.margin.options[selections.margin].label : 'No evaluado';
    const f = selections.echogenicFoci.length ? selections.echogenicFoci.map(i => TIRADS_CRITERIA.echogenicFoci.options[i].label).join(', ') : 'Ninguno';

    const text = `NÃ³dulo Tiroideo (ACR TI-RADS):
- ComposiciÃ³n: ${c}
- Ecogenicidad: ${e}
- Forma: ${s}
- Margen: ${m}
- Focos EcogÃ©nicos: ${f}

Puntaje total: ${pts} puntos.
CategorÃ­a: ${category} (${risk}).
RecomendaciÃ³n: ${recs}.`;
    copyToClipboard(text);
  };

  return (
    <div className="space-y-4 pb-20">
      {Object.entries(TIRADS_CRITERIA).map(([key, data]) => (
        <div key={key} className="bg-white dark:bg-slate-800 p-4 rounded-2xl shadow-sm border border-slate-100 dark:border-slate-700">
          <h3 className="font-semibold text-slate-800 dark:text-slate-200 mb-3 text-sm">{data.title}</h3>
          <div className="space-y-2">
            {data.options.map((opt, i) => {
              const isSelected = data.multi ? selections[key].includes(i) : selections[key] === i;
              return (
                <button
                  key={i}
                  onClick={() => toggleSelection(key, i, data.multi)}
                  className={`w-full text-left p-3 rounded-xl border text-sm transition-all ${isSelected ? 'border-blue-500 bg-blue-50 dark:bg-blue-500/10 text-blue-700 dark:text-blue-300' : 'border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-slate-300 dark:hover:border-slate-600'}`}
                >
                  <div className="flex justify-between items-center">
                    <span>{opt.label}</span>
                    <span className="text-xs font-medium bg-white dark:bg-slate-900 px-2 py-1 rounded-md opacity-70">+{opt.points} pt</span>
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      ))}

      <div className="fixed bottom-0 left-0 right-0 bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 p-4 shadow-lg safe-area-pb z-40">

          </button>
        </div>
      </div>

}
