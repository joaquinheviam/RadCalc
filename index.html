  <!-- Datos estructurados (schema.org) para buscadores -->
  <!-- Bloque "WebSite" independiente del "WebApplication" de abajo: Google usa
       específicamente el tipo WebSite (junto con og:site_name arriba) para
       decidir el "Site Name" que muestra en los resultados de búsqueda junto
       al favicon (antes de este cambio, al no encontrar ninguna señal
       explícita, Google mostraba "Vercel" — la plataforma de hosting — en su
       lugar). No reemplaza al bloque WebApplication, que describe la app en
       sí (categoría, autor, precio, etc.) y se deja intacto. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "RadioCalc Clinical",
    "alternateName": "RadioCalc",
    "url": "https://radiocalc.app/"
  }
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "RadioCalc Clinical",
    "alternateName": "Calculadora Radiológica",
    "url": "https://radiocalc.app/",
    "description": "Calculadoras radiológicas, algoritmos de decisión y escalas de puntuación para la práctica clínica diaria, con integración de las guías de las principales sociedades científicas, apoyo para el manejo de hallazgos incidentales, y todo basado en evidencia: TI-RADS, PI-RADS, O-RADS, LI-RADS, VI-RADS, PSAD, fracción grasa por RM, ASPECTS, Bone-RADS, criterios de Mirels y más de 40 calculadoras para el informe radiológico diario (ACR, ATS/ERS, entre otras).",
    "applicationCategory": "HealthApplication",
    "applicationSubCategory": "Radiology reference calculators",
    "operatingSystem": "Any (web/PWA)",
    "inLanguage": ["es", "en"],
    "isAccessibleForFree": true,
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "author": {
      "@type": "Physician",
      "name": "Joaquín Hevia Morel",
      "url": "https://orcid.org/0000-0002-9500-5503",
      "jobTitle": "Radiólogo, Profesor Clínico Asistente",
      "medicalSpecialty": "Radiología (imágenes de tórax, abdomen y pelvis)",
      "affiliation": {
        "@type": "MedicalOrganization",
        "name": "Hospital Clínico Pontificia Universidad Católica de Chile (Red de Salud UC-Christus)"
      }
    }
  }
  </script>

  <!-- Google Analytics (GA4) — mismo ID en todos los dominios (radiocalc.app y el alias antiguo rad-calc.vercel.app) para que las visitas de ambos se consoliden en un solo reporte. Para que efectivamente aparezcan juntas hace falta además agregar ambos dominios en "Configure your domains" dentro de Admin > Data Streams > (este stream) > Configure tag settings, en la cuenta de Google Analytics. La inicialización vive en /ga-init.js (en vez de un <script> inline) para poder aplicar Content-Security-Policy estricta — ver vercel.json. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J9SS8JKL7D"></script>
  <script src="/ga-init.js"></script>
</head>
